<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SENware – Demo</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
    background: #f3faf6;
  }
  .card {
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,.05);
  }
</style>
</head>

<body>
<div id="root" class="p-3"></div>

<script type="text/babel">
const { useState } = React;

/* ---------------- DEMO DATA ---------------- */
const students = [
  {
    id: "s1",
    name: "Student A",
    year: "1st Year",
    snapshot: {
      needs: "ASD – routine sensitive",
      triggers: "Noise, sudden changes",
      supports: "Quiet entry, visual timetable",
      medical: "N/A"
    }
  },
  {
    id: "s2",
    name: "Student B",
    year: "3rd Year",
    snapshot: {
      needs: "ADHD",
      triggers: "Long sitting",
      supports: "Movement breaks",
      medical: "N/A"
    }
  }
];

function App() {
  const [selected, setSelected] = useState(students[0]);
  const [note, setNote] = useState("");
  const [alerts, setAlerts] = useState([]);
  const [adminOpen, setAdminOpen] = useState(false);

  function sendAlert() {
    if (!note.trim()) return alert("Enter a short note");
    setAlerts([
      {
        text: note,
        time: new Date().toLocaleTimeString(),
        from: "SNA"
      },
      ...alerts
    ]);
    setNote("");
  }

  return (
    <div className="space-y-4 max-w-md mx-auto">

      {/* HEADER */}
      <div className="card p-4 text-center">
        <h1 className="text-xl font-semibold text-emerald-700">SENware</h1>
        <p className="text-sm text-slate-600 mt-1">
          Demo – SEN Communication & Handover
        </p>
      </div>

      {/* VIDEO */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">
          ▶️ 30-Second Walkthrough
        </p>
        <video controls playsInline className="w-full rounded-lg">
          <source src="SENware_Mobile_Voiceover.mp4" type="video/mp4" />
          Your browser does not support video.
        </video>
        <p className="text-xs text-slate-500 mt-2">
          (Video plays locally — no internet required)
        </p>
      </div>

      {/* STUDENT SNAPSHOT */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">
          Student Snapshot
        </p>

        <div className="flex gap-2 mb-3">
          {students.map(s => (
            <button
              key={s.id}
              onClick={() => setSelected(s)}
              className={`flex-1 p-2 rounded-lg text-sm ${
                selected.id === s.id
                  ? "bg-emerald-600 text-white"
                  : "bg-emerald-50 text-emerald-800"
              }`}
            >
              {s.name}
            </button>
          ))}
        </div>

        <div className="text-sm space-y-1">
          <div><strong>Needs:</strong> {selected.snapshot.needs}</div>
          <div><strong>Triggers:</strong> {selected.snapshot.triggers}</div>
          <div><strong>Supports:</strong> {selected.snapshot.supports}</div>
          <div><strong>Medical:</strong> {selected.snapshot.medical}</div>
        </div>
      </div>

      {/* ALERT */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">
          Quick Alert
        </p>
        <input
          className="w-full border rounded-lg p-2 text-sm"
          placeholder="e.g. Absent this morning"
          value={note}
          onChange={e => setNote(e.target.value)}
        />
        <button
          onClick={sendAlert}
          className="mt-2 w-full bg-emerald-600 text-white rounded-lg p-2"
        >
          Send Alert
        </button>
      </div>

      {/* HANDOVER LOG */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">
          SNA Handover Log
        </p>

        {alerts.length === 0 && (
          <p className="text-sm text-slate-500">
            No handover notes yet.
          </p>
        )}

        <ul className="space-y-2">
          {alerts.map((a, i) => (
            <li key={i} className="border rounded-lg p-2 text-sm">
              <div>{a.text}</div>
              <div className="text-xs text-slate-400 mt-1">
                {a.time} • From {a.from}
              </div>
            </li>
          ))}
        </ul>
      </div>

      {/* FEEDBACK */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">
          Quick Feedback
        </p>
        <a
          href="https://docs.google.com/forms/d/e/1FAIpQLScL5SkWYIoPDhybgEU8flLw9TCZSI2nh0217NCoNiKym_UAOg/viewform"
          target="_blank"
          className="block text-center bg-emerald-600 text-white rounded-lg p-3 font-semibold"
        >
          Give Feedback (1 minute)
        </a>
      </div>

      {/* ADMIN LINK */}
      <div className="text-center">
        <button
          onClick={() => setAdminOpen(true)}
          className="text-xs text-slate-400 underline"
        >
          Admin View
        </button>
      </div>

      {/* ADMIN VIEW */}
      {adminOpen && (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
          <div className="bg-white rounded-xl p-5 max-w-sm w-full space-y-4">
            <h2 className="text-lg font-semibold text-emerald-700">
              SENware – Admin Overview
            </h2>

            <div className="text-sm space-y-1">
              <p><strong>Alerts logged:</strong> {alerts.length}</p>
              <p><strong>Demo students:</strong> {students.length}</p>
              <p><strong>Last activity:</strong> {alerts[0]?.time || "None yet"}</p>
            </div>

            <div className="text-xs text-slate-500 border-t pt-2">
              Initials only • No real student data<br/>
              Demo / pilot use only
            </div>

            <div className="flex gap-2">
              <button
                onClick={() => setAlerts([])}
                className="flex-1 bg-slate-100 rounded p-2 text-sm"
              >
                Reset Demo
              </button>
              <button
                onClick={() => setAdminOpen(false)}
                className="flex-1 bg-emerald-600 text-white rounded p-2 text-sm"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      )}

      <div className="text-center text-xs text-slate-400 py-2">
        Demo only • No real student data
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
