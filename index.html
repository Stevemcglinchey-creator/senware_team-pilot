<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SENwear Team Pilot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1f7a5c" />

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f2f24;
      color: #ffffff;
    }

    .container {
      max-width: 420px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      color: #7fe0b2;
      margin-bottom: 6px;
    }

    h2 {
      color: #7fe0b2;
      margin-top: 24px;
    }

    .card {
      background: #1b3d32;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    video {
      width: 100%;
      border-radius: 10px;
      background: black;
    }

    select, input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }

    textarea {
      resize: none;
      height: 70px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .send-btn {
      background: #2fa46f;
      color: white;
    }

    .ack-btn {
      background: #355e50;
      color: #b6ffe1;
      font-size: 14px;
      margin-top: 8px;
    }

    .feedback-btn {
      background: #1f7a5c;
      color: white;
      margin-top: 8px;
    }

    .alert {
      background: #274e41;
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
      font-size: 14px;
    }

    .timestamp {
      font-size: 12px;
      opacity: 0.7;
    }

    .acknowledged {
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>SENwear Team Pilot</h1>
    <p style="text-align:center;font-size:14px;">
      Internal staff communication pilot
    </p>

    <!-- VIDEO -->
    <div class="card">
      <h2>Video Walkthrough</h2>
      <video controls>
        <source src="Team_Pilot.mp4" type="video/mp4">
        Your browser does not support video.
      </video>
    </div>

    <!-- QUICK ALERT -->
    <div class="card">
      <h2>Quick Alert</h2>

      <select id="role">
        <option value="">Select role</option>
        <option>VP / Principal</option>
        <option>SENCO</option>
        <option>SNA</option>
        <option>Teacher</option>
      </select>

      <input id="initials" placeholder="Your initials (e.g. SM)" />
      <input id="student" placeholder="Student initials (e.g. D.B)" />

      <select id="type">
        <option value="">Alert type</option>
        <option>Health</option>
        <option>Attendance</option>
        <option>Academic</option>
        <option>Behaviour</option>
        <option>Needs-to-Know</option>
      </select>

      <textarea id="message" placeholder="Type alert message"></textarea>

      <button class="send-btn" onclick="sendAlert()">Send Alert</button>
    </div>

    <!-- LIVE FEED -->
    <div class="card">
      <h2>Live Alerts (Last 24 Hours)</h2>
      <div id="alerts"></div>
    </div>

    <!-- FEEDBACK -->
    <div class="card">
      <h2>Feedback</h2>
      <button class="feedback-btn" onclick="openFeedback()">Give Feedback (1 min)</button>
    </div>

  </div>

  <script>
    // 🔥 FIREBASE CONFIG — PASTE YOUR OWN VALUES HERE
    const firebaseConfig = {
      apiKey: "AIzaSyCBSUdvQvD0KR15Sq7flF9CmZ2LqmSMFxM",
      authDomain: "senwear-team-pilot.firebaseapp.com",
      projectId: "senwear-team-pilot",
      storageBucket: "senwear-team-pilot.firebasestorage.app",
      messagingSenderId: "2002144696",
      appId: "1:2002144696:web:31f81e3c5c1764a290934d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const DAY = 24 * 60 * 60 * 1000;

    function sendAlert() {
      const role = document.getElementById("role").value;
      const initials = document.getElementById("initials").value;
      const student = document.getElementById("student").value;
      const type = document.getElementById("type").value;
      const message = document.getElementById("message").value;

      if (!role || !initials || !student || !type || !message) {
        alert("Please fill everything");
        return;
      }

      db.collection("alerts").add({
        role,
        initials,
        student,
        type,
        message,
        timestamp: Date.now(),
        acknowledged: false
      });

      document.getElementById("message").value = "";
    }

    function acknowledge(id) {
      db.collection("alerts").doc(id).update({
        acknowledged: true
      });
    }

    function loadAlerts() {
      db.collection("alerts")
        .orderBy("timestamp", "desc")
        .onSnapshot(snapshot => {
          const list = document.getElementById("alerts");
          list.innerHTML = "";

          snapshot.forEach(doc => {
            const a = doc.data();
            if (Date.now() - a.timestamp > DAY) return;

            const div = document.createElement("div");
            div.className = "alert" + (a.acknowledged ? " acknowledged" : "");
            div.innerHTML = `
              <strong>${a.type}</strong><br>
              ${a.student} — ${a.message}<br>
              <em>${a.role} (${a.initials})</em>
              <div class="timestamp">${new Date(a.timestamp).toLocaleTimeString()}</div>
              ${!a.acknowledged ? `<button class="ack-btn" onclick="acknowledge('${doc.id}')">Acknowledge</button>` : ""}
            `;
            list.appendChild(div);
          });
        });
    }

    function openFeedback() {
      window.open("https://docs.google.com/forms/d/e/1FAIpQLScL5SkWYIoPDhybgEU8flLw9TCZSI2nh0217NCoNiKym_UAOg/viewform?usp=header", "_blank");
    }

    loadAlerts();
  </script>
</body>
</html>
