<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <title>Senwear Team Pilot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .header p {
      opacity: 0.9;
      font-size: 14px;
    }
    .content {
      padding: 24px;
    }
    .card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h3 {
      color: #333;
      margin-bottom: 12px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: white;
      border-radius: 10px;
      margin-top: 12px;
    }
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ccc;
    }
    .status-dot.active {
      background: #4caf50;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .test-btn {
      background: linear-gradient(135deg, #4caf50, #45a049);
    }
    .log {
      background: #1e1e1e;
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      padding: 12px;
      border-radius: 10px;
      max-height: 200px;
      overflow-y: auto;
    }
    .log p {
      margin: 4px 0;
    }
    video {
      width: 100%;
      border-radius: 12px;
      margin-top: 8px;
    }
    .error-msg {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
    }
    .success-msg {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📡 Senwear Team Pilot</h1>
      <p>Internal staff communication + push notifications + CSV import</p>
    </div>
    <div class="content">
      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>
      
      <div class="card">
        <h3>🔔 Notification Status</h3>
        <div class="status">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Checking permissions...</span>
        </div>
        <button id="enableBtn">Enable Notifications</button>
      </div>
      
      <div class="card">
        <h3>📱 Test Notification</h3>
        <button id="testBtn" class="test-btn" disabled>Send Test Notification</button>
      </div>
      
      <div class="card">
        <h3>🎥 Video Walkthrough</h3>
        <video controls>
          <source src="/Team_Pilot.mp4" type="video/mp4">
        </video>
      </div>
      
      <div class="card">
        <h3>📋 Debug Log</h3>
        <div id="debugLog" class="log">
          <p>▶️ App initialized...</p>
        </div>
      </div>
    </div>
    <footer style="text-align: center; padding: 16px; background: #f8f9fa; font-size: 12px; color: #666;">
      Senwear Team Pilot v1.0 | Internal Use Only
    </footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBSUdvQvD0KR15Sq7fLF9CmZ2LqmSMFxm",
      authDomain: "senwear-team-pilot.firebaseapp.com",
      projectId: "senwear-team-pilot",
      storageBucket: "senwear-team-pilot.firebasestorage.app",
      messagingSenderId: "20021144696",
      appId: "1:20021144696:web:31f81e3c5c1764a290934d"
    };

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);
    
    const enableBtn = document.getElementById('enableBtn');
    const testBtn = document.getElementById('testBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const errorMsgDiv = document.getElementById('errorMsg');
    const successMsgDiv = document.getElementById('successMsg');
    const debugLog = document.getElementById('debugLog');

    function addLog(msg, isError = false) {
      const p = document.createElement('p');
      p.style.color = isError ? '#ff6b6b' : '#0f0';
      p.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
      debugLog.appendChild(p);
      debugLog.scrollTop = debugLog.scrollHeight;
      console.log(msg);
    }

    function showError(msg) {
      errorMsgDiv.textContent = msg;
      errorMsgDiv.style.display = 'block';
      successMsgDiv.style.display = 'none';
      setTimeout(() => errorMsgDiv.style.display = 'none', 5000);
      addLog(`❌ ${msg}`, true);
    }

    function showSuccess(msg) {
      successMsgDiv.textContent = msg;
      successMsgDiv.style.display = 'block';
      errorMsgDiv.style.display = 'none';
      setTimeout(() => successMsgDiv.style.display = 'none', 3000);
      addLog(`✅ ${msg}`);
    }

    function updateStatus(enabled) {
      if (enabled) {
        statusDot.className = 'status-dot active';
        statusText.textContent = 'Notifications enabled ✓';
        enableBtn.style.display = 'none';
        testBtn.disabled = false;
      } else {
        statusDot.className = 'status-dot';
        statusText.textContent = 'Notifications disabled';
        enableBtn.style.display = 'block';
        testBtn.disabled = true;
      }
    }

    async function enableNotifications() {
      addLog('Requesting notification permission...');
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          addLog('Permission granted');
          updateStatus(true);
          showSuccess('Notifications enabled!');
          
          try {
            const token = await getToken(messaging);
            if (token) {
              addLog(`Token received: ${token.substring(0, 30)}...`);
            }
          } catch(e) {
            addLog(`Token error: ${e.message}`, true);
          }
        } else {
          addLog('Permission denied', true);
          updateStatus(false);
          showError('Notification permission denied');
        }
      } catch(e) {
        addLog(`Error: ${e.message}`, true);
        showError(e.message);
      }
    }

    function testNotification() {
      if (Notification.permission === 'granted') {
        new Notification('Senwear Test', {
          body: 'Notifications are working!',
          icon: '/Icon-192.png'
        });
        addLog('Test notification sent');
        showSuccess('Test notification sent!');
      } else {
        showError('Please enable notifications first');
      }
    }

    enableBtn.onclick = enableNotifications;
    testBtn.onclick = testNotification;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(() => addLog('Service Worker registered'))
        .catch(e => addLog(`SW failed: ${e.message}`, true));
    }

    if (Notification.permission === 'granted') {
      updateStatus(true);
      addLog('Notifications already enabled');
    } else {
      updateStatus(false);
    }

    addLog('App ready');
  </script>
</body>
</html>
