<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SENwear – Team Pilot</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f6feb">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- iOS fallback icon (harmless on Android) -->
  <link rel="apple-touch-icon" href="Icon-192.png">

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4f6f8;
      color: #222;
      text-align: center;
    }

    header {
      background: #1f6feb;
      color: white;
      padding: 16px;
      font-size: 1.3em;
      font-weight: 600;
    }

    .container {
      padding: 20px;
    }

    video {
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .note {
      margin-top: 20px;
      font-size: 0.95em;
      color: #555;
    }
  </style>
</head>

<body>

<header>
  SENwear – Team Pilot
</header>

<div class="container">
  <p>
    This is a private SENwear team pilot.<br>
    Click play to explore the demo.
  </p>

  <video controls playsinline>
    <source src="Team_Pilot.mp4" type="video/mp4">
    Your browser does not support video playback.
  </video>

  <div class="note">
    Pilot data uses student initials only.<br>
    All data is deleted at the end of the pilot.
  </div>
</div>

</body>
</html>
