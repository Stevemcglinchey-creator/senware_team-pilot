<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENware Team Pilot</title>

<style>
body{
font-family:system-ui;
background:#0f2f24;
color:white;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
}

.card{
background:#1b3d32;
border-radius:20px;
padding:20px;
margin-bottom:20px;
border:1px solid #2f5e4c;
}

h1{
color:#7fe0b2;
text-align:center;
}

h2{
color:#7fe0b2;
}

input,select,textarea{
width:100%;
padding:12px;
margin:8px 0;
border-radius:12px;
border:none;
background:#0f2f24;
color:white;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:40px;
border:none;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.enable-btn{
background:#1f7a5c;
}

.enable-btn.on{
background:#2fa46f;
}

.send-btn{
background:#2fa46f;
}

.alert{
background:#274e41;
border-radius:12px;
padding:12px;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h1>📡 SENware Team Pilot</h1>
<p style="text-align:center">Real-time staff alerts</p>

<button id="enableBtn" class="enable-btn">🔔 Enable Notifications</button>
<div id="statusMsg"></div>
</div>

<div class="card">
<h2>⚡ Send Alert</h2>

<select id="role">
<option>SNA</option>
<option>Teacher</option>
<option>SENCO</option>
<option>VP</option>
</select>

<input id="initials" placeholder="Your initials">

<input id="student" placeholder="Student initials">

<select id="type">
<option>Health</option>
<option>Behaviour</option>
<option>Attendance</option>
<option>Needs-to-Know</option>
</select>

<textarea id="message" rows="3" placeholder="Type alert message"></textarea>

<button id="sendBtn" class="send-btn">Send Alert</button>

<div id="sendStatus"></div>

</div>

<div class="card">
<h2>📡 Live Alerts</h2>
<div id="alertsList">No alerts yet</div>
</div>

</div>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyDbruzYo2ln8XY9MqTqXVkSsKUodeEux1U",
authDomain: "senwear-pilot-2.firebaseapp.com",
projectId: "senwear-pilot-2",
storageBucket: "senwear-pilot-2.firebasestorage.app",
messagingSenderId: "926491466146",
appId: "1:926491466146:web:1148a3e80ebeef3b15fafb"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const enableBtn=document.getElementById("enableBtn");
const statusMsg=document.getElementById("statusMsg");
const sendBtn=document.getElementById("sendBtn");
const sendStatus=document.getElementById("sendStatus");
const alertsList=document.getElementById("alertsList");

let notificationsEnabled=false;
let lastAlertTime=Date.now();

function vibratePhone(){
if(navigator.vibrate){
navigator.vibrate([200,100,200]);
}
}

function showNotification(title,message){

if(!notificationsEnabled) return;

if(Notification.permission==="granted"){
new Notification(title,{body:message});
}

vibratePhone();

}

enableBtn.onclick=async function(){

const permission=await Notification.requestPermission();

if(permission==="granted"){

notificationsEnabled=true;

enableBtn.textContent="✅ Notifications ON";
enableBtn.classList.add("on");

statusMsg.innerHTML="Notifications enabled";

}else{

statusMsg.innerHTML="Permission denied";

}

};

sendBtn.onclick=async function(){

const role=document.getElementById("role").value;
const initials=document.getElementById("initials").value;
const student=document.getElementById("student").value;
const type=document.getElementById("type").value;
const message=document.getElementById("message").value;

if(!initials||!message){

sendStatus.innerHTML="Fill initials and message";

return;

}

sendStatus.innerHTML="Sending...";

await db.collection("alerts").add({

role:role,
initials:initials.toUpperCase(),
student:student,
type:type,
message:message,
timestamp:Date.now(),
acknowledged:false

});

document.getElementById("message").value="";

sendStatus.innerHTML="Sent";

};

window.acknowledge=async function(id){

await db.collection("alerts").doc(id).update({

acknowledged:true

});

};

db.collection("alerts")
.orderBy("timestamp","desc")
.onSnapshot(snapshot=>{

if(snapshot.empty){

alertsList.innerHTML="No alerts";

return;

}

let html="";

snapshot.docChanges().forEach(change=>{

if(change.type==="added"){

const a=change.doc.data();

if(a.timestamp>lastAlertTime){

lastAlertTime=a.timestamp;

showNotification(
"📢 SENware Alert",
`${a.initials}: ${a.message}`
);

}

}

});

snapshot.forEach(doc=>{

const a=doc.data();

if(Date.now()-a.timestamp>86400000) return;

html+=`

<div class="alert">

<strong>${a.type}</strong><br>
${a.student} — ${a.message}<br>
<em>${a.role} (${a.initials})</em><br>

${!a.acknowledged ?
`<button onclick="acknowledge('${doc.id}')">✓ Acknowledge</button>`
:"Acknowledged"}

</div>

`;

});

alertsList.innerHTML=html;

});

</script>

</body>
</html>
