<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SENwear Team Pilot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1f7a5c" />

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0f2f24;
      color: #ffffff;
    }
    .container { max-width: 600px; margin: auto; padding: 16px; }
    h1 { text-align: center; color: #7fe0b2; margin-bottom: 6px; }
    h2 { color: #7fe0b2; margin-top: 24px; font-size: 1.3rem; }
    .card {
      background: #1b3d32;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #2f5e4c;
    }
    video { width: 100%; border-radius: 12px; background: black; }
    select, input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      background: #0f2f24;
      color: white;
      font-family: inherit;
    }
    textarea { resize: none; height: 70px; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 40px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .send-btn { background: #2fa46f; color: white; }
    .ack-btn { background: #355e50; color: #b6ffe1; font-size: 14px; margin-top: 8px; padding: 8px; }
    .feedback-btn, .import-btn { background: #1f7a5c; color: white; }
    .alert {
      background: #274e41;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      font-size: 14px;
    }
    .timestamp { font-size: 11px; opacity: 0.7; margin-top: 6px; }
    .acknowledged { opacity: 0.6; }
    .status-badge {
      display: inline-block;
      background: #1f7a5c;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .student-item {
      background: #0f2f24;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      border-left: 3px solid #2fa46f;
    }
    .collapsible-header {
      background: #1f7a5c;
      padding: 12px 16px;
      border-radius: 40px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .collapsible-content { display: none; margin-top: 12px; }
    .collapsible-content.open { display: block; }
    .arrow { transition: transform 0.2s; }
    .arrow.open { transform: rotate(90deg); }
  </style>
</head>

<body>
  <div class="container">
    <h1>SENwear Team Pilot</h1>
    <p style="text-align:center;font-size:14px;">Internal staff communication + push notifications + CSV import</p>

    <div class="card" style="padding: 12px; text-align: center;">
      <div id="notificationStatus" class="status-badge">🔔 Checking...</div>
    </div>

    <div class="card">
      <h2>📹 Video Walkthrough</h2>
      <video controls><source src="Team_Pilot.mp4" type="video/mp4"></video>
    </div>

    <div class="card">
      <h2>⚡ Quick Alert</h2>
      <select id="role">
        <option value="">Select role</option>
        <option>VP / Principal</option>
        <option>SENCO</option>
        <option>SNA</option>
        <option>Teacher</option>
      </select>
      <input id="initials" placeholder="Your initials (e.g. SM)" />
      <input id="student" placeholder="Student initials (e.g. D.B)" />
      <select id="type">
        <option value="">Alert type</option>
        <option>Health</option>
        <option>Attendance</option>
        <option>Academic</option>
        <option>Behaviour</option>
        <option>Needs-to-Know</option>
      </select>
      <textarea id="message" placeholder="Type alert message"></textarea>
      <button class="send-btn" id="sendAlertBtn">Send Alert</button>
    </div>

    <div class="card">
      <h2>📡 Live Alerts</h2>
      <div id="alerts"></div>
    </div>

    <div class="card">
      <h2>💬 Feedback</h2>
      <button class="feedback-btn" id="feedbackBtn">Give Feedback</button>
    </div>

    <div class="card">
      <div class="collapsible-header" id="csvToggle">
        <span>📁 Student Management (CSV Import)</span>
        <span class="arrow">▶</span>
      </div>
      <div class="collapsible-content" id="csvContent">
        <p>Upload CSV: Initials, Year, MedicalFlags, Supports</p>
        <input type="file" id="csvFile" accept=".csv">
        <button class="import-btn" id="importBtn">Import Students</button>
        <div id="importStatus"></div>
        <hr>
        <h2>👥 Students</h2>
        <div id="studentList">No students yet.</div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAFFgp4m6fCssJiswmIMA6RLJ0cskUrAVk",
      authDomain: "senwear-team-pilot.firebaseapp.com",
      projectId: "senwear-team-pilot",
      storageBucket: "senwear-team-pilot.firebasestorage.app",
      messagingSenderId: "2002144696",
      appId: "1:2002144696:web:31f81e3c5c1764a290934d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const messaging = firebase.messaging();
    const VAPID_KEY = "BHHEkcdII53eQ2T8PkNe8ll7x21HfYUSqqadcrT4AdIi9h3HQL-5T3RUJjZwIMpantCdS4ewJOVpxGaDok8-qIk";

    const sendBtn = document.getElementById('sendAlertBtn');
    const notificationStatusSpan = document.getElementById('notificationStatus');

    function getDeviceId() {
      let id = localStorage.getItem('senwear_device_id');
      if (!id) {
        id = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('senwear_device_id', id);
      }
      return id;
    }

    async function saveToken(token) {
      const deviceId = getDeviceId();
      try {
        await db.collection('tokens').doc(deviceId).set({
          token: token,
          deviceId: deviceId,
          lastActive: new Date().toISOString()
        });
        console.log('Token saved');
      } catch(e) { console.log('Save error:', e); }
    }

    // Setup notifications - simplified
    async function enableNotifications() {
      if (!('Notification' in window)) return;
      
      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        notificationStatusSpan.textContent = '🔔 ON';
        try {
          const token = await messaging.getToken({ vapidKey: VAPID_KEY });
          if (token) await saveToken(token);
        } catch(e) { console.log('Token error:', e); }
      } else {
        notificationStatusSpan.textContent = '🔕 Blocked';
      }
    }

    // Handle messages when app is open
    messaging.onMessage((payload) => {
      if (payload.notification) {
        new Notification(payload.notification.title, {
          body: payload.notification.body,
          icon: '/Icon-192.png'
        });
      }
    });

    // Service worker - don't let errors break the app
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then(() => console.log('SW ready'))
        .catch(() => console.log('SW not available - notifications may still work in foreground'));
    }

    // Send alert
    sendBtn.addEventListener('click', async () => {
      const role = document.getElementById('role').value;
      const initials = document.getElementById('initials').value;
      const student = document.getElementById('student').value;
      const type = document.getElementById('type').value;
      const message = document.getElementById('message').value;

      if (!role || !initials || !student || !type || !message) {
        alert('Please fill everything');
        return;
      }

      await db.collection('alerts').add({
        role, initials, student, type, message,
        timestamp: Date.now(),
        acknowledged: false
      });

      document.getElementById('message').value = '';
      sendBtn.textContent = '✓ Sent!';
      setTimeout(() => sendBtn.textContent = 'Send Alert', 1500);
    });

    // Acknowledge
    window.acknowledge = async (id) => {
      await db.collection('alerts').doc(id).update({ acknowledged: true });
    };

    // Live alerts
    db.collection('alerts').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
      const alertsDiv = document.getElementById('alerts');
      alertsDiv.innerHTML = '';
      let hasRecent = false;
      const DAY_MS = 24 * 60 * 60 * 1000;
      
      snapshot.forEach(doc => {
        const a = doc.data();
        if (Date.now() - a.timestamp > DAY_MS) return;
        hasRecent = true;
        const div = document.createElement('div');
        div.className = 'alert' + (a.acknowledged ? ' acknowledged' : '');
        div.innerHTML = `
          <strong>${a.type}</strong><br>
          ${a.student} — ${a.message}<br>
          <em>${a.role} (${a.initials})</em>
          <div class="timestamp">${new Date(a.timestamp).toLocaleTimeString()}</div>
          ${!a.acknowledged ? `<button class="ack-btn" onclick="acknowledge('${doc.id}')">✓ Acknowledge</button>` : ''}
        `;
        alertsDiv.appendChild(div);
      });
      
      if (!hasRecent) alertsDiv.innerHTML = '<div class="alert">No alerts in last 24 hours.</div>';
    });

    // CSV Import
    const importBtn = document.getElementById('importBtn');
    const csvFile = document.getElementById('csvFile');
    const importStatus = document.getElementById('importStatus');
    const studentList = document.getElementById('studentList');

    function parseCSV(text) {
      const lines = text.split('\n').filter(l => l.trim());
      if (lines.length < 2) return [];
      const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
      const students = [];
      for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split(',');
        const student = {};
        headers.forEach((h, idx) => { student[h] = values[idx] ? values[idx].trim() : ''; });
        if (student.initials) students.push(student);
      }
      return students;
    }

    importBtn.onclick = () => {
      const file = csvFile.files[0];
      if (!file) { importStatus.textContent = 'Select a CSV file'; return; }
      const reader = new FileReader();
      reader.onload = async (e) => {
        const students = parseCSV(e.target.result);
        importStatus.textContent = `Importing ${students.length}...`;
        let success = 0;
        for (const s of students) {
          try {
            await db.collection('students').add(s);
            success++;
          } catch(err) { console.log(err); }
        }
        importStatus.textContent = `✅ Imported ${success} of ${students.length}`;
        csvFile.value = '';
      };
      reader.readAsText(file);
    };

    db.collection('students').onSnapshot(snapshot => {
      if (snapshot.empty) { studentList.innerHTML = '<p>No students yet</p>'; return; }
      let html = '';
      snapshot.forEach(doc => {
        const s = doc.data();
        html += `<div class="student-item"><strong>${s.initials}</strong> · ${s.year || 'Year?'}<br>🏥 ${s.medicalflags || 'None'}<br>🛡️ ${s.supports || 'None'}</div>`;
      });
      studentList.innerHTML = html;
    });

    // Collapsible
    document.getElementById('csvToggle').onclick = () => {
      document.getElementById('csvContent').classList.toggle('open');
      document.querySelector('.arrow').classList.toggle('open');
    };

    // Feedback
    document.getElementById('feedbackBtn').onclick = () => {
      window.open("https://docs.google.com/forms/d/e/1FAIpQLScL5SkWYIoPDhybgEU8flLw9TCZSI2nh0217NCoNiKym_UAOg/viewform", "_blank");
    };

    // Check status and enable if needed
    if (Notification.permission === 'granted') {
      notificationStatusSpan.textContent = '🔔 ON';
      messaging.getToken({ vapidKey: VAPID_KEY }).then(t => t && saveToken(t)).catch(e => console.log(e));
    } else if (Notification.permission === 'denied') {
      notificationStatusSpan.textContent = '🔕 Blocked';
    } else {
      notificationStatusSpan.textContent = '🔔 Tap to enable';
      notificationStatusSpan.style.cursor = 'pointer';
      notificationStatusSpan.onclick = enableNotifications;
    }
  </script>
</body>
</html>
