<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

  const firebaseConfig = {

    authDomain: "senwear-team-pilot.firebaseapp.com",
    projectId: "senwear-team-pilot",

  };

  const app = initializeApp(firebaseConfig);
  const messaging = getMessaging(app);

  // Request permission and get token
  async function requestNotificationPermission() {
    try {
      const token = await getToken(messaging, {
        vapidKey: "BHHEkcdII53eQ2T8PkNe8ll7x21HfYUSqqadcrT4AdIi9h3HQL-5T3RUJjZwIMpantCdS4ewJOVpxGaDok8-qIk" // You'll need to add this from Firebase Console

    } catch (err) {
      console.error("Error getting token:", err);
    }
  }

  // Handle foreground messages
  onMessage(messaging, (payload) => {
    console.log("Message received:", payload);
    new Notification(payload.notification.title, {
      body: payload.notification.body,
      icon: "/Icon-192.png"
    });
  });

  requestNotificationPermission();
</script>
