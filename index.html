<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SENware – Team Pilot</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont; background: #f3faf6; }
  .card { background: #ffffff; border-radius: 14px; box-shadow: 0 4px 10px rgba(0,0,0,.05); }
</style>
</head>

<body>
<div id="root" class="p-3"></div>

<script type="text/babel">
const { useState } = React;

// ---------------- DEMO DATA ----------------
const students = [
  { id: "s1", name: "D.B", year: "1st Year", snapshot: { needs: "ASD – routine sensitive", triggers: "Noise, sudden changes", supports: "Quiet entry, visual timetable", medical: "N/A" } },
  { id: "s2", name: "A.M", year: "3rd Year", snapshot: { needs: "ADHD", triggers: "Long sitting", supports: "Movement breaks", medical: "N/A" } }
];

// Google Sheet Webhook
const SHEET_WEBHOOK = "https://script.google.com/macros/s/AKfycbwpA1C8SNQFicB4BMAwxIARq8if1PD7uDEPqHM3_ydD298XoJzTsP_lLtXcCgKnyMSH/exec";

function App() {
  const [selected, setSelected] = useState(students[0]);
  const [note, setNote] = useState("");
  const [alerts, setAlerts] = useState([]);

  function sendAlert() {
    if (!note.trim()) return alert("Enter a short note");

    const payload = { student: selected.name, note: note, from: "SNA" };

    // Send to Google Sheet
    fetch(SHEET_WEBHOOK, {
      method: "POST",
      body: JSON.stringify(payload),
    })
    .then(res => res.json())
    .then(data => console.log("Sent to sheet:", data))
    .catch(err => console.error("Error sending to sheet:", err));

    // Add to local log
    setAlerts([{ text: note, time: new Date().toLocaleTimeString(), from: "SNA" }, ...alerts]);
    setNote("");
  }

  return (
    <div className="space-y-4 max-w-md mx-auto">

      {/* HEADER */}
      <div className="card p-4 text-center">
        <h1 className="text-xl font-semibold text-emerald-700">SENware</h1>
        <p className="text-sm text-slate-600 mt-1">Team Pilot – SNA & Sub View</p>
      </div>

      {/* VIDEO WALKTHROUGH */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">▶️ 35-Second Walkthrough</p>
        <video controls className="w-full rounded-lg">
          <source src="Team_Pilot.mp4" type="video/mp4" />
          Your browser does not support video.
        </video>
      </div>

      {/* STUDENT SELECT */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">Student Snapshot</p>
        <div className="flex gap-2">
          {students.map(s => (
            <button
              key={s.id}
              onClick={() => setSelected(s)}
              className={`flex-1 p-2 rounded-lg text-sm ${selected.id === s.id ? "bg-emerald-600 text-white" : "bg-emerald-50 text-emerald-800"}`}
            >
              {s.name}
            </button>
          ))}
        </div>

        <div className="mt-3 text-sm space-y-1">
          <div><strong>Needs:</strong> {selected.snapshot.needs}</div>
          <div><strong>Triggers:</strong> {selected.snapshot.triggers}</div>
          <div><strong>Supports:</strong> {selected.snapshot.supports}</div>
          <div><strong>Medical:</strong> {selected.snapshot.medical}</div>
        </div>
      </div>

      {/* ALERT SYSTEM */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">Quick Alert</p>
        <input
          className="w-full border rounded-lg p-2 text-sm"
          placeholder="e.g. Absent this morning"
          value={note}
          onChange={e => setNote(e.target.value)}
        />
        <button onClick={sendAlert} className="mt-2 w-full bg-emerald-600 text-white rounded-lg p-2">Send Alert</button>
      </div>

      {/* HANDOVER LOG */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">SNA Handover Log</p>
        {alerts.length === 0 && <p className="text-sm text-slate-500">No handover notes yet.</p>}
        <ul className="space-y-2">
          {alerts.map((a, i) => (
            <li key={i} className="border rounded-lg p-2 text-sm">
              <div className="text-slate-700">{a.text}</div>
              <div className="text-xs text-slate-400 mt-1">{a.time} • From {a.from}</div>
            </li>
          ))}
        </ul>
      </div>

      {/* FEEDBACK BUTTON */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">Quick Feedback</p>
        <p className="text-sm text-slate-600 mb-3">Your feedback helps shape the next version of SENware.</p>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScL5SkWYIoPDhybgEU8flLw9TCZSI2nh0217NCoNiKym_UAOg/viewform?usp=header"
           target="_blank"
           className="block text-center bg-emerald-600 text-white rounded-lg p-3 font-semibold">Give Feedback (1 minute)</a>
      </div>

      <div className="text-center text-xs text-slate-400 py-2">Demo only • No real student data</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
