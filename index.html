<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SENware – Team Pilot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body { background:#f3faf6; font-family: system-ui; }
.card { background:white; border-radius:16px; box-shadow:0 4px 10px rgba(0,0,0,.08); }
</style>
</head>

<body class="p-3 max-w-xl mx-auto">

<!-- HEADER -->
<div class="card p-4 text-center mb-4">
  <img src="Icon-192.png" class="mx-auto w-20 mb-2">
  <h1 class="text-xl font-bold text-emerald-700">SENware – Team Pilot</h1>
  <p class="text-sm text-slate-500">Internal communication pilot</p>
</div>

<!-- SEND ALERT -->
<div class="card p-4 mb-4">
  <h2 class="font-semibold text-emerald-700 mb-2">Send Alert</h2>

  <input id="initials" placeholder="Student Initials (e.g. J.D)"
    class="w-full border p-2 rounded mb-2">

  <input id="message" placeholder="What’s happening?"
    class="w-full border p-2 rounded mb-2">

  <button onclick="sendAlert()"
    class="w-full bg-emerald-600 text-white p-3 rounded font-semibold">
    Send Alert
  </button>
</div>

<!-- LIVE FEED -->
<div class="card p-4 mb-4">
  <h2 class="font-semibold text-emerald-700 mb-2">Live Alerts</h2>
  <div id="feed" class="space-y-2 text-sm"></div>
</div>

<!-- FEEDBACK -->
<div class="card p-4 text-center">
  <a href="PASTE_YOUR_GOOGLE_FORM_LINK_HERE"
     target="_blank"
     class="block bg-orange-500 text-white p-3 rounded font-semibold">
    Give Feedback (1 min)
  </a>
</div>

<script>
  // 🔴 PASTE YOUR FIREBASE CONFIG HERE
  const firebaseConfig = {
    apiKey: "PASTE",
    authDomain: "PASTE",
    projectId: "PASTE",
    storageBucket: "PASTE",
    messagingSenderId: "PASTE",
    appId: "PASTE"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  function sendAlert() {
    const initials = document.getElementById("initials").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!initials || !message) {
      alert("Fill both fields");
      return;
    }

    db.collection("alerts").add({
      initials,
      message,
      time: new Date()
    });

    document.getElementById("initials").value = "";
    document.getElementById("message").value = "";
  }

  db.collection("alerts")
    .orderBy("time", "desc")
    .onSnapshot(snapshot => {
      const feed = document.getElementById("feed");
      feed.innerHTML = "";
      snapshot.forEach(doc => {
        const d = doc.data();
        feed.innerHTML += `
          <div class="border-l-4 border-emerald-500 pl-2">
            <strong>${d.initials}</strong><br>
            ${d.message}
          </div>`;
      });
    });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => {
          console.log('Service Worker registered', reg);
        })
        .catch(err => {
          console.log('Service Worker failed', err);
        });
    });
  }
</script>

</body>
</html>
