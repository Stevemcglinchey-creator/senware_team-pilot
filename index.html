<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SENwear Team Pilot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f2f24; color: white; padding: 20px; }
    .container { max-width: 600px; margin: auto; }
    .card { background: #1b3d32; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #2f5e4c; }
    h1 { color: #7fe0b2; text-align: center; margin-bottom: 10px; }
    h2 { color: #7fe0b2; font-size: 1.3rem; margin-bottom: 15px; }
    input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: none; background: #0f2f24; color: white; }
    button { width: 100%; padding: 14px; margin-top: 12px; border-radius: 40px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
    .enable-btn { background: #1f7a5c; color: white; }
    .enable-btn.on { background: #2fa46f; }
    .send-btn { background: #2fa46f; color: white; }
    .alert { background: #274e41; border-radius: 12px; padding: 12px; margin-top: 10px; }
    .debug { background: #0a1a15; padding: 12px; border-radius: 12px; font-family: monospace; font-size: 11px; margin-top: 12px; max-height: 150px; overflow-y: auto; }
    .status-msg { font-size: 12px; margin-top: 8px; color: #7fe0b2; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>📡 SENwear Team Pilot</h1>
      <p style="text-align:center">Internal staff communication + push notifications + CSV import</p>
      <button id="enableBtn" class="enable-btn">🔔 Enable Notifications</button>
      <div id="statusMsg" class="status-msg"></div>
      <div id="debugLog" class="debug">App loaded. Click enable.</div>
    </div>

    <div class="card">
      <h2>📹 Video Walkthrough</h2>
      <video controls style="width:100%; border-radius:12px;"><source src="Team_Pilot.mp4" type="video/mp4"></video>
    </div>

    <div class="card">
      <h2>⚡ Quick Alert</h2>
      <select id="role"><option>SNA</option><option>Teacher</option><option>SENCO</option><option>VP</option></select>
      <input id="initials" placeholder="Your initials" />
      <input id="student" placeholder="Student initials" />
      <select id="type"><option>Health</option><option>Behaviour</option><option>Attendance</option><option>Needs-to-Know</option></select>
      <textarea id="message" rows="3" placeholder="Type alert message"></textarea>
      <button id="sendBtn" class="send-btn">Send Alert</button>
      <div id="sendStatus" class="status-msg"></div>
    </div>

    <div class="card">
      <h2>📡 Live Alerts</h2>
      <div id="alertsList">No alerts yet</div>
    </div>

    <div class="card">
      <button id="feedbackBtn">Give Feedback</button>
    </div>

    <div class="card">
      <div style="background:#1f7a5c; padding:12px; border-radius:40px; cursor:pointer; text-align:center;" id="csvToggle">📁 Student Management (CSV Import)</div>
      <div id="csvContent" style="display:none; margin-top:15px;">
        <input type="file" id="csvFile" accept=".csv">
        <button id="importBtn">Import Students</button>
        <div id="importStatus"></div>
        <h2>👥 Students</h2>
        <div id="studentList">No students</div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

  <script>
    // ========== PUT YOUR FIREBASE CONFIG HERE ==========
    const firebaseConfig = {
      apiKey: "AIzaSyDbruzYo2ln8XY9MqTqXVkSsKUodeEux1U",
      authDomain: "senwear-pilot-2.firebaseapp.com",
      projectId: "senwear-pilot-2",
      storageBucket: "senwear-pilot-2.firebasestorage.app",
      messagingSenderId: "926491466146",
      appId: "1:926491466146:web:1148a3e80ebeef3b15fafb"
    };
    // ========== PUT YOUR VAPID KEY HERE ==========
    const VAPID_KEY = "BHQbQTfknjVMsBv2LISk6W3p1SJgasmLXgj-p58KgigzvtjFORWZVmPCgpHo8ExuTbkgNjS7uJCDIc36v9R9MWA";

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const messaging = firebase.messaging();

    // DOM elements
    const enableBtn = document.getElementById('enableBtn');
    const statusMsg = document.getElementById('statusMsg');
    const debugLog = document.getElementById('debugLog');
    const sendBtn = document.getElementById('sendBtn');
    const sendStatus = document.getElementById('sendStatus');
    const alertsList = document.getElementById('alertsList');

    let notificationsEnabled = false;

    function addDebug(msg) {
      const p = document.createElement('div');
      p.textContent = '> ' + new Date().toLocaleTimeString() + ': ' + msg;
      debugLog.appendChild(p);
      debugLog.scrollTop = debugLog.scrollHeight;
      console.log(msg);
    }

    function getDeviceId() {
      let id = localStorage.getItem('device_id');
      if (!id) {
        id = 'device_' + Date.now();
        localStorage.setItem('device_id', id);
      }
      return id;
    }

    async function saveToken(token) {
      try {
        await db.collection('tokens').doc(getDeviceId()).set({
          token: token,
          lastActive: new Date().toISOString()
        });
        addDebug('✅ TOKEN SAVED to Firestore!');
        statusMsg.innerHTML = '✅ Ready to receive alerts';
        return true;
      } catch(e) {
        addDebug('❌ Save failed: ' + e.message);
        return false;
      }
    }

    async function enableNotifications() {
      addDebug('Requesting permission...');
      const permission = await Notification.requestPermission();
      addDebug('Permission: ' + permission);
      
      if (permission !== 'granted') {
        statusMsg.innerHTML = '❌ Permission denied';
        return;
      }
      
      addDebug('Getting FCM token...');
      try {
        const token = await messaging.getToken({ vapidKey: VAPID_KEY });
        if (token) {
          addDebug('✅ Token received: ' + token.substring(0, 25) + '...');
          await saveToken(token);
          notificationsEnabled = true;
          enableBtn.textContent = '✅ Notifications ON';
          enableBtn.classList.add('on');
        } else {
          addDebug('❌ No token received');
        }
      } catch(e) {
        addDebug('❌ Token error: ' + e.message);
      }
    }

    messaging.onMessage((payload) => {
      addDebug('📨 Message received while app open');
      if (payload.notification) {
        new Notification(payload.notification.title, {
          body: payload.notification.body,
          icon: '/Icon-192.png'
        });
      }
    });

    sendBtn.onclick = async () => {
      const role = document.getElementById('role').value;
      const initials = document.getElementById('initials').value;
      const student = document.getElementById('student').value;
      const type = document.getElementById('type').value;
      const message = document.getElementById('message').value;
      
      if (!initials || !message) {
        sendStatus.innerHTML = '⚠️ Please fill initials and message';
        setTimeout(() => sendStatus.innerHTML = '', 2000);
        return;
      }
      
      sendStatus.innerHTML = '📤 Sending...';
      
      try {
        const docRef = await db.collection('alerts').add({
          role: role,
          initials: initials.toUpperCase(),
          student: student,
          type: type,
          message: message,
          timestamp: Date.now(),
          acknowledged: false
        });
        
        addDebug('✅ Alert saved with ID: ' + docRef.id);
        sendStatus.innerHTML = '✅ Sent!';
        document.getElementById('message').value = '';
        setTimeout(() => sendStatus.innerHTML = '', 2000);
        
        // Show local confirmation
        if (notificationsEnabled) {
          new Notification('Alert Sent', {
            body: `${initials}: ${message.substring(0, 50)}`,
            icon: '/Icon-192.png'
          });
        }
      } catch(e) {
        addDebug('❌ Send error: ' + e.message);
        sendStatus.innerHTML = '❌ Error: ' + e.message;
      }
    };

    window.acknowledge = async (id) => {
      try {
        await db.collection('alerts').doc(id).update({ acknowledged: true });
        addDebug('Alert acknowledged: ' + id);
      } catch(e) {
        addDebug('Acknowledge error: ' + e.message);
      }
    };

    // Real-time alerts listener
    db.collection('alerts')
      .orderBy('timestamp', 'desc')
      .onSnapshot(snapshot => {
        addDebug('Alerts updated, count: ' + snapshot.size);
        
        if (snapshot.empty) {
          alertsList.innerHTML = '<div class="alert">No alerts yet. Send one above!</div>';
          return;
        }
        
        let html = '';
        const ONE_DAY = 24 * 60 * 60 * 1000;
        let hasRecent = false;
        
        snapshot.forEach(doc => {
          const a = doc.data();
          if (Date.now() - a.timestamp > ONE_DAY) return;
          hasRecent = true;
          html += `
            <div class="alert">
              <strong>${a.type || 'Alert'}</strong><br>
              ${a.student || ''} — ${a.message}<br>
              <em>${a.role} (${a.initials})</em>
              <div class="timestamp">${new Date(a.timestamp).toLocaleString()}</div>
              ${!a.acknowledged ? `<button onclick="acknowledge('${doc.id}')" style="background:#355e50; margin-top:8px; padding:6px;">✓ Acknowledge</button>` : ''}
            </div>
          `;
        });
        
        alertsList.innerHTML = hasRecent ? html : '<div class="alert">No alerts in last 24 hours</div>';
      }, error => {
        addDebug('Firestore error: ' + error.message);
        alertsList.innerHTML = '<div class="alert">Error loading alerts. Check console.</div>';
      });

    // CSV Import
    document.getElementById('importBtn').onclick = () => {
      const file = document.getElementById('csvFile').files[0];
      if (!file) { document.getElementById('importStatus').textContent = 'Select a CSV file'; return; }
      const reader = new FileReader();
      reader.onload = async (e) => {
        const lines = e.target.result.split('\n').filter(l => l.trim());
        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
        let imported = 0;
        for (let i = 1; i < lines.length; i++) {
          const vals = lines[i].split(',');
          const student = {};
          headers.forEach((h, idx) => student[h] = vals[idx]?.trim());
          if (student.initials) {
            await db.collection('students').add(student);
            imported++;
          }
        }
        document.getElementById('importStatus').textContent = `✅ Imported ${imported} students`;
        document.getElementById('csvFile').value = '';
      };
      reader.readAsText(file);
    };

    db.collection('students').onSnapshot(snapshot => {
      const container = document.getElementById('studentList');
      if (snapshot.empty) { container.innerHTML = 'No students yet. Import a CSV file.'; return; }
      let html = '';
      snapshot.forEach(doc => {
        const s = doc.data();
        html += `<div class="student-item"><strong>${s.initials}</strong> · ${s.year || 'Year not set'}<br>🏥 ${s.medicalflags || 'No medical flags'}<br>🛡️ ${s.supports || 'No supports listed'}</div>`;
      });
      container.innerHTML = html;
    });

    document.getElementById('csvToggle').onclick = () => {
      const content = document.getElementById('csvContent');
      content.style.display = content.style.display === 'none' ? 'block' : 'none';
    };

    document.getElementById('feedbackBtn').onclick = () => {
      window.open("https://docs.google.com/forms/d/e/1FAIpQLScL5SkWYIoPDhybgEU8flLw9TCZSI2nh0217NCoNiKym_UAOg/viewform", "_blank");
    };

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then(() => addDebug('Service Worker registered'))
        .catch(err => addDebug('SW error: ' + err.message));
    }

    // Check existing permission
    if (Notification.permission === 'granted') {
      notificationsEnabled = true;
      enableBtn.textContent = '✅ Notifications ON';
      enableBtn.classList.add('on');
      statusMsg.innerHTML = 'Ready';
      messaging.getToken({ vapidKey: VAPID_KEY }).then(token => token && saveToken(token));
    } else {
      enableBtn.onclick = enableNotifications;
    }
  </script>
</body>
</html>
