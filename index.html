
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SENwear – Team Pilot</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body { background:#f3faf6; font-family:system-ui; }
.card { background:#fff; border-radius:14px; box-shadow:0 4px 10px rgba(0,0,0,.05); }
</style>
</head>

<body class="p-3">

<!-- HEADER -->
<div class="card p-4 text-center mb-4">
  <img src="Icon-192.png" class="mx-auto w-20 mb-2">
  <h1 class="text-xl font-semibold text-emerald-700">SENwear Team Pilot</h1>
  <p class="text-sm text-slate-500">Live SEN communication pilot</p>
</div>

<!-- VIDEO -->
<div class="card p-3 mb-4">
  <video controls class="w-full rounded-lg">
    <source src="Team_Pilot.mp4" type="video/mp4">
  </video>
</div>

<!-- SEND ALERT -->
<div class="card p-3 mb-4">
  <input id="initials" class="w-full border p-2 rounded mb-2" placeholder="Your initials">
  <input id="message" class="w-full border p-2 rounded mb-2" placeholder="Type alert">
  <button onclick="sendAlert()" class="w-full bg-emerald-600 text-white p-3 rounded font-semibold">
    Send Alert
  </button>
</div>

<!-- LIVE ALERTS -->
<div id="alerts" class="space-y-3"></div>

<!-- FEEDBACK -->
<a href="https://docs.google.com/forms/d/e/1FAIpQLScL5SkWYIoPDhybgEU8flLw9TCZSI2nh0217NCoNiKym_UAOg/viewform?usp=header"
   target="_blank"
   class="block mt-4 text-center bg-orange-500 text-white p-3 rounded font-semibold">
Give Feedback (1 min)
</a>

<script>
/* 🔥 PASTE YOUR FIREBASE CONFIG BELOW 🔥 */
const firebaseConfig = {
  apiKey: "AIzaSyCBSUdvQvD0KR15Sq7flF9CmZ2LqmSMFxM",
  authDomain: "senwear-team-pilot.firebaseapp.com",
  projectId: "senwear-team-pilot",
  storageBucket: "senwear-team-pilot.firebasestorage.app",
  messagingSenderId: "2002144696",
  appId: "1:2002144696:web:31f81e3c5c1764a290934d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function sendAlert() {
  const msg = document.getElementById("message").value;
  const initials = document.getElementById("initials").value;

  if (!msg || !initials) return alert("Fill both fields");

  db.collection("alerts").add({
    message: msg,
    initials: initials,
    sender: "SNA",
    acknowledged: false,
    timestamp: Date.now()
  });

  document.getElementById("message").value = "";
}

db.collection("alerts")
  .orderBy("timestamp", "desc")
  .onSnapshot(snapshot => {
    const box = document.getElementById("alerts");
    box.innerHTML = "";
    snapshot.forEach(doc => {
      const d = doc.data();
      box.innerHTML += `
        <div class="card p-3">
          <p class="font-semibold">${d.initials}</p>
          <p>${d.message}</p>
          ${!d.acknowledged ? `<button onclick="ack('${doc.id}')" class="text-sm text-emerald-600 mt-2">Acknowledge</button>` : `<p class="text-xs text-slate-400 mt-2">Acknowledged</p>`}
        </div>
      `;
    });
  });

function ack(id) {
  db.collection("alerts").doc(id).update({ acknowledged: true });
}
</script>

</body>
</html>
