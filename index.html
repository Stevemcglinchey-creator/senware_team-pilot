<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SENwear – Team Pilot</title>

  <!-- Icons -->
  <link rel="icon" href="Icon-192.png">
  <link rel="apple-touch-icon" href="Icon-192.png">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f7;
      margin: 0;
      padding: 16px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    select, input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
    }

    button {
      background: #2e8b57; /* calming green */
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 14px;
    }

    button:hover {
      opacity: 0.9;
    }

    .alert-card {
      border-left: 6px solid #2e8b57;
      padding: 12px;
      margin-bottom: 12px;
      background: #ffffff;
      border-radius: 6px;
    }

    .ack-btn {
      background: #0077cc;
      margin-top: 8px;
    }

    .acknowledged {
      color: green;
      font-weight: bold;
    }

    video {
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<h1>SENwear – Team Pilot</h1>

<!-- 🎥 DEMO VIDEO (manual play only) -->
<div class="card">
  <h3>Quick Walkthrough</h3>
  <video controls>
    <source src="Team_Pilot.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</div>

<!-- 🚨 SEND ALERT -->
<div class="card">
  <h3>Send Alert</h3>

  <label>Role</label>
  <select id="role">
    <option value="SNA">SNA</option>
    <option value="SENCO">SENCO</option>
    <option value="VP">VP</option>
    <option value="Principal">Principal</option>
  </select>

  <label>Initials</label>
  <input id="initials" placeholder="e.g. SM" />

  <label>Alert Message</label>
  <textarea id="message" placeholder="e.g. Blood reading lower than normal"></textarea>

  <button onclick="sendAlert()">Send Alert</button>
</div>

<!-- 📡 LIVE ALERT FEED -->
<div class="card">
  <h3>Live Alerts (last 24 hours)</h3>
  <div id="alerts">Loading alerts...</div>
</div>

<!-- 🔥 FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    updateDoc,
    doc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // 🔧 PASTE YOUR FIREBASE CONFIG HERE
  const firebaseConfig = {
    apiKey: "AIzaSyCBSUdvQvD0KR15Sq7flF9CmZ2LqmSMFxM",
    authDomain: "senwear-team-pilot.firebaseapp.com",
    projectId: "senwear-team-pilot",
    storageBucket: "senwear-team-pilot.firebasestorage.app",
    messagingSenderId: "2002144696",
    appId: "1:2002144696:web:31f81e3c5c1764a290934d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const alertsRef = collection(db, "alerts");

  const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;

  // 📤 SEND ALERT
  window.sendAlert = async function () {
    const role = document.getElementById("role").value;
    const initials = document.getElementById("initials").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!initials || !message) {
      alert("Please enter initials and message");
      return;
    }

    await addDoc(alertsRef, {
      role,
      initials,
      message,
      acknowledged: false,
      timestamp: Date.now()
    });

    document.getElementById("message").value = "";
  };

  // 📡 LIVE FEED (24HR FILTER)
  onSnapshot(alertsRef, snapshot => {
    const alerts = [];
    snapshot.forEach(docSnap => {
      alerts.push({ id: docSnap.id, ...docSnap.data() });
    });

    renderAlerts(alerts);
  });

  function renderAlerts(alerts) {
    const container = document.getElementById("alerts");
    container.innerHTML = "";

    const now = Date.now();
    const recentAlerts = alerts.filter(a => now - a.timestamp < TWENTY_FOUR_HOURS);

    if (recentAlerts.length === 0) {
      container.innerHTML = "<p>No alerts in the last 24 hours.</p>";
      return;
    }

    recentAlerts.sort((a, b) => b.timestamp - a.timestamp);

    recentAlerts.forEach(alert => {
      const div = document.createElement("div");
      div.className = "alert-card";

      div.innerHTML = `
        <strong>${alert.role} (${alert.initials})</strong><br>
        ${alert.message}<br>
        <small>${new Date(alert.timestamp).toLocaleTimeString()}</small><br>
        ${
          alert.acknowledged
            ? "<div class='acknowledged'>Acknowledged</div>"
            : `<button class="ack-btn" onclick="acknowledge('${alert.id}')">Acknowledge</button>`
        }
      `;

      container.appendChild(div);
    });
  }

  // ✅ ACKNOWLEDGE
  window.acknowledge = async function (id) {
    await updateDoc(doc(db, "alerts", id), {
      acknowledged: true
    });
  };
</script>

</body>
</html>
