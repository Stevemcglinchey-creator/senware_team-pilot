<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SENwear Team Pilot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      margin: 0;
      background: #f1f5f9;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 14px;
      font-size: 18px;
      font-weight: 600;
    }

    section {
      padding: 14px;
      background: white;
      margin-bottom: 10px;
    }

    input, select, textarea, button {
      font-size: 16px;
      padding: 8px;
      margin-top: 6px;
      width: 100%;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button.secondary {
      background: #16a34a;
    }

    button:disabled {
      background: #9ca3af;
      cursor: default;
    }

    .alert-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      background: #f9fafb;
    }

    .ack-btn {
      margin-top: 8px;
      background: #16a34a;
    }

    .ack-btn:disabled {
      background: #9ca3af;
    }
  </style>
</head>

<body>

<header>SENwear — Team Pilot</header>

<!-- USER SETUP -->
<section>
  <strong>Your details</strong>

  <input id="initials" placeholder="Your initials (e.g. SM)" maxlength="3" />

  <select id="role">
    <option value="">Select role</option>
    <option>SNA</option>
    <option>Teacher</option>
    <option>SENCO</option>
    <option>Deputy Principal</option>
    <option>Principal</option>
  </select>

  <button onclick="saveUser()">Save details</button>
</section>

<!-- SEND ALERT -->
<section>
  <strong>Send alert</strong>

  <textarea id="alertText" placeholder="Enter alert message"></textarea>

  <button class="secondary" onclick="sendAlert()">Send alert</button>
</section>

<!-- LIVE ALERTS -->
<section>
  <strong>Live alerts</strong>
  <div id="alerts"></div>
</section>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // 🔴 CHANGE THIS — paste YOUR Firebase config here
  const firebaseConfig = {
    apiKey: "AIzaSyCBSUdvQvD0KR15Sq7flF9CmZ2LqmSMFxM",
    authDomain: "senwear-team-pilot.firebaseapp.com",
    projectId: "senwear-team-pilot",
    storageBucket: "senwear-team-pilot.firebasestorage.app",
    messagingSenderId: "2002144696",
    appId: "1:2002144696:web:31f81e3c5c1764a290934d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // SAVE USER
  window.saveUser = function () {
    const initials = initialsInput.value.trim();
    const role = roleSelect.value;

    if (!initials || !role) {
      alert("Enter initials and role");
      return;
    }

    localStorage.setItem("senwear_initials", initials);
    localStorage.setItem("senwear_role", role);
    alert("Saved");
  };

  const initialsInput = document.getElementById("initials");
  const roleSelect = document.getElementById("role");

  // LOAD SAVED USER
  initialsInput.value = localStorage.getItem("senwear_initials") || "";
  roleSelect.value = localStorage.getItem("senwear_role") || "";

  // SEND ALERT
  window.sendAlert = async function () {
    const text = document.getElementById("alertText").value.trim();
    const initials = localStorage.getItem("senwear_initials");
    const role = localStorage.getItem("senwear_role");

    if (!text || !initials || !role) {
      alert("Missing details");
      return;
    }

    await addDoc(collection(db, "alerts"), {
      message: text,
      initials,
      role,
      acknowledged: false,
      timestamp: serverTimestamp()
    });

    document.getElementById("alertText").value = "";
  };

  // LIVE ALERT LISTENER
  const alertsDiv = document.getElementById("alerts");
  const q = query(collection(db, "alerts"), orderBy("timestamp", "desc"));

  onSnapshot(q, (snapshot) => {
    alertsDiv.innerHTML = "";

    snapshot.forEach(docSnap => {
      const a = docSnap.data();
      const id = docSnap.id;

      const div = document.createElement("div");
      div.className = "alert-card";

      div.innerHTML = `
        <strong>${a.initials} — ${a.role}</strong><br>
        ${a.message}<br>
        <button class="ack-btn" ${a.acknowledged ? "disabled" : ""}>
          ${a.acknowledged ? "Acknowledged" : "Acknowledge"}
        </button>
      `;

      const btn = div.querySelector("button");
      btn.onclick = () => acknowledge(id);

      alertsDiv.appendChild(div);
    });
  });

  // ACKNOWLEDGE
  async function acknowledge(id) {
    await updateDoc(doc(db, "alerts", id), {
      acknowledged: true
    });
  }
</script>

</body>
</html>
