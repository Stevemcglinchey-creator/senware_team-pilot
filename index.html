
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENwear Team Pilot</title>

<!-- Theme & PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1724">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; background:#eef8f2; color:#0f1724;}
  header { background: #0f1724; color: #eef8f2; padding: 1rem; text-align: center; }
  main { padding: 1rem; max-width: 600px; margin: auto;}
  video { width: 100%; border-radius: 8px; margin-bottom: 1rem; }
  button { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 0.5rem;}
  #feedbackBtn { background: #f39c12; color: white; }
  #ackBtn { background: #27ae60; color: white; }
  #alerts { margin-top: 1rem; padding: 1rem; background: #fff; border-radius: 8px; min-height: 150px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
  .alertItem { border-bottom: 1px solid #ccc; padding: 0.5rem 0;}
  .alertItem:last-child { border: none; }
</style>
</head>
<body>

<header>
  <h1>SENwear Team Pilot</h1>
</header>

<main>
  <!-- Pilot Video -->
  <video id="pilotVideo" controls>
    <source src="Team_Pilot.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Buttons -->
  <div>
    <button id="feedbackBtn" onclick="openFeedback()">Give Feedback</button>
    <button id="ackBtn" onclick="acknowledgeAlert()">Acknowledge</button>
  </div>

  <!-- Live Alerts -->
  <div id="alerts">
    <h3>Live Alerts</h3>
    <div id="alertList"></div>
  </div>
</main>

<!-- Firebase & App Scripts -->
<script>
  // const firebaseConfig = {
  apiKey: "AIzaSyCBSUdvQvD0KR15Sq7flF9CmZ2LqmSMFxM",
  authDomain: "senwear-team-pilot.firebaseapp.com",
  projectId: "senwear-team-pilot",
  storageBucket: "senwear-team-pilot.firebasestorage.app",
  messagingSenderId: "2002144696",
  appId: "1:2002144696:web:31f81e3c5c1764a290934d"
};

  // 2️⃣ Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // 3️⃣ Feedback Button
  function openFeedback() {
    window.open(https://docs.google.com/forms/d/e/1FAIpQLScL5SkWYIoPDhybgEU8flLw9TCZSI2nh0217NCoNiKym_UAOg/viewform?usp=header, '_blank');
  }

  // 4️⃣ Live Alerts - load existing & new
  const alertList = document.getElementById('alertList');
  db.collection("alerts").orderBy("timestamp", "desc")
    .onSnapshot(snapshot => {
      alertList.innerHTML = ""; // Clear list
      snapshot.forEach(doc => {
        const data = doc.data();
        const div = document.createElement('div');
        div.className = 'alertItem';
        div.textContent = `${data.sender || 'Staff'}: ${data.message} ${data.acknowledged ? '✅' : ''}`;
        alertList.appendChild(div);
      });
    });

  // 5️⃣ Acknowledge button - live update
  function acknowledgeAlert() {
    db.collection("alerts").get().then(snapshot => {
      snapshot.forEach(doc => {
        db.collection("alerts").doc(doc.id).update({ acknowledged: true });
      });
    });
  }
</script>

<!-- Service Worker for PWA -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').then(function(registration) {
        console.log('ServiceWorker registered:', registration.scope);
      }, function(err) {
        console.log('ServiceWorker registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
