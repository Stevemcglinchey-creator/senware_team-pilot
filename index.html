  <div class="header">

    <div class="badge">Pilot Programme • Donegal</div>
  </div>

  <div class="card">
    <div class="status-badge" id="notificationStatus">
      <span>🔔</span> <span id="statusText">Checking...</span>
    </div>
    <div id="debugLog" style="font-size: 0.7rem; color: #64748b; margin-top: 12px;"></div>
  </div>

  <div class="card">
    <h2 style="font-size: 1.2rem; margin-bottom: 16px;">⚡ Quick Alert</h2>
    <div class="form-group">
      <label>Student initials</label>
      <input type="text" id="student" placeholder="e.g., JD" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Alert type</label>
      <select id="type">
        <option value="Health">Health</option>
        <option value="Behaviour">Behaviour</option>
        <option value="Attendance">Attendance</option>
        <option value="Academic">Academic</option>
      </select>
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea id="message" rows="3" placeholder="What's happening?"></textarea>
    </div>
    <div class="form-group">
      <label>Your initials</label>
      <input type="text" id="initials" placeholder="e.g., SM" autocomplete="off">
    </div>
    <button id="sendAlertBtn" class="send-btn">📢 Send Alert</button>
    <div id="sendStatus" style="font-size: 0.75rem; margin-top: 12px; text-align: center;"></div>
  </div>

  <div class="card">
    <h2 style="font-size: 1.2rem; margin-bottom: 16px;">📡 Live Alerts</h2>
    <div id="alertsList" class="alerts-list">
      <div class="loading">Loading alerts...</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  // ========== PASSCODE ==========
  // Change this to whatever passcode you want for your team
  const PILOT_PASSCODE = "SNA2026";

  // Check if already unlocked
  const isUnlocked = localStorage.getItem('senwear_unlocked') === 'true';

  const passcodeOverlay = document.getElementById('passcodeOverlay');
  const mainApp = document.getElementById('mainApp');
  const passcodeInput = document.getElementById('passcodeInput');
  const unlockBtn = document.getElementById('unlockBtn');
  const passcodeError = document.getElementById('passcodeError');

  function unlockApp() {
    passcodeOverlay.style.display = 'none';
    mainApp.style.display = 'block';
    localStorage.setItem('senwear_unlocked', 'true');
    initFirebase();
  }

  unlockBtn.onclick = () => {
    if (passcodeInput.value === PILOT_PASSCODE) {
      unlockApp();
    } else {
      passcodeError.textContent = '❌ Invalid passcode';
      passcodeInput.value = '';
    }
  };

  passcodeInput.onkeypress = (e) => {
    if (e.key === 'Enter') unlockBtn.click();
  };

  if (isUnlocked) {
    unlockApp();
  }

  // ========== FIREBASE ==========
  function initFirebase() {
    const firebaseConfig = {
      apiKey: "AIzaSyDbruzYo2ln8XY9MqTqXVkSsKUodeEux1U",
      authDomain: "senwear-pilot-2.firebaseapp.com",
      projectId: "senwear-pilot-2",
      storageBucket: "senwear-pilot-2.firebasestorage.app",
      messagingSenderId: "926491466146",
      appId: "1:926491466146:web:1148a3e80ebeef3b15fafb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const sendBtn = document.getElementById('sendAlertBtn');
    const sendStatus = document.getElementById('sendStatus');
    const alertsList = document.getElementById('alertsList');
    const debugLog = document.getElementById('debugLog');
    const statusText = document.getElementById('statusText');

    function addDebug(msg) {
      const p = document.createElement('div');
      p.textContent = '> ' + new Date().toLocaleTimeString() + ': ' + msg;
      debugLog.appendChild(p);
      console.log(msg);
    }

    addDebug('App ready. Passcode unlocked.');

    // Send alert
    sendBtn.onclick = async () => {
      const student = document.getElementById('student').value.trim();
      const type = document.getElementById('type').value;
      const message = document.getElementById('message').value.trim();
      const initials = document.getElementById('initials').value.trim();

      if (!student || !message || !initials) {
        sendStatus.innerHTML = '⚠️ Please fill student, message, and your initials';
        sendStatus.style.color = '#dc2626';
        setTimeout(() => sendStatus.innerHTML = '', 2000);
        return;
      }

      sendStatus.innerHTML = '📤 Sending...';
      sendStatus.style.color = '#1a5f4c';

      try {
        await db.collection('alerts').add({
          student: student.toUpperCase(),
          type: type,
          message: message,
          initials: initials.toUpperCase(),
          timestamp: Date.now(),
          acknowledged: false
        });

        sendStatus.innerHTML = '✅ Alert sent!';
        document.getElementById('message').value = '';
        setTimeout(() => sendStatus.innerHTML = '', 2000);
        addDebug('Alert saved to Firestore');
      } catch (e) {
        sendStatus.innerHTML = '❌ Error: ' + e.message;
        sendStatus.style.color = '#dc2626';
        addDebug('Error: ' + e.message);
      }
    };

    // Live alerts feed
    db.collection('alerts')
      .orderBy('timestamp', 'desc')
      .onSnapshot(snapshot => {
        if (snapshot.empty) {
          alertsList.innerHTML = '<div class="loading">No alerts yet</div>';
          return;
        }

        let html = '';
        snapshot.forEach(doc => {
          const a = doc.data();
          if (Date.now() - a.timestamp > 86400000) return;
          const date = new Date(a.timestamp).toLocaleTimeString();
          html += `
            <div class="alert-item">
              <div class="alert-time">${date}</div>
              <span class="alert-student">${a.student || '?'}</span>
              <span style="font-size:0.7rem; background:#eef2ff; padding:2px 8px; border-radius:20px; margin-left:8px;">${a.type}</span>
              <div class="alert-message">${a.message}</div>
              <div class="alert-sender">— ${a.initials}</div>
            </div>
          `;
        });
        alertsList.innerHTML = html;
        addDebug(`Loaded ${snapshot.size} alerts`);
      });

    statusText.innerHTML = 'Live feed active';
    addDebug('Firestore connected');
  }
</script>
