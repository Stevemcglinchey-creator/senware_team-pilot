<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SENwear Team Pilot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f2f24; color: white; padding: 20px; }
    .container { max-width: 600px; margin: auto; }
    .card { background: #1b3d32; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #2f5e4c; }
    h1 { color: #7fe0b2; text-align: center; margin-bottom: 10px; }
    h2 { color: #7fe0b2; font-size: 1.3rem; margin-bottom: 15px; }
    input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: none; background: #0f2f24; color: white; }
    button { width: 100%; padding: 14px; margin-top: 12px; border-radius: 40px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
    .enable-btn { background: #1f7a5c; color: white; }
    .enable-btn.on { background: #2fa46f; }
    .send-btn { background: #2fa46f; color: white; }
    .alert { background: #274e41; border-radius: 12px; padding: 12px; margin-top: 10px; }
    .debug { background: #0a1a15; padding: 12px; border-radius: 12px; font-family: monospace; font-size: 11px; margin-top: 12px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .status-msg { font-size: 12px; margin-top: 8px; color: #7fe0b2; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>📡 SENwear Team Pilot</h1>
      <p style="text-align:center">Internal staff communication + push notifications</p>
      <button id="enableBtn" class="enable-btn">🔔 Enable Notifications</button>
      <div id="statusMsg" class="status-msg"></div>
      <div id="debugLog" class="debug">App loaded. Click enable.</div>
    </div>

    <div class="card">
      <h2>⚡ Quick Alert</h2>
      <select id="role"><option>SNA</option><option>Teacher</option><option>SENCO</option><option>VP</option></select>
      <input id="initials" placeholder="Your initials" />
      <input id="student" placeholder="Student initials" />
      <select id="type"><option>Health</option><option>Behaviour</option><option>Attendance</option><option>Needs-to-Know</option></select>
      <textarea id="message" rows="3" placeholder="Type alert message"></textarea>
      <button id="sendBtn" class="send-btn">Send Alert</button>
      <div id="sendStatus" class="status-msg"></div>
    </div>

    <div class="card">
      <h2>📡 Live Alerts</h2>
      <div id="alertsList">No alerts yet</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

  <script>
    // ========== YOUR FIREBASE CONFIG ==========
   const firebaseConfig = {
      apiKey: "AIzaSyDbruzYo2ln8XY9MqTqXVkSsKUodeEux1U",
      authDomain: "senwear-pilot-2.firebaseapp.com",
      projectId: "senwear-pilot-2",
      storageBucket: "senwear-pilot-2.firebasestorage.app",
      messagingSenderId: "926491466146",
      appId: "1:926491466146:web:1148a3e80ebeef3b15fafb"

    };
    // ========== YOUR VAPID KEY ==========
    const VAPID_KEY = "BHQbQTfknjVMsBv2LISk6W3p1SJgasmLXgj-p58KgigzvtjFORWZVmPCgpHo8ExuTbkgNjS7uJCDIc36v9R9MWA";

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const messaging = firebase.messaging();

    const enableBtn = document.getElementById('enableBtn');
    const statusMsg = document.getElementById('statusMsg');
    const debugLog = document.getElementById('debugLog');
    const sendBtn = document.getElementById('sendBtn');
    const sendStatus = document.getElementById('sendStatus');
    const alertsList = document.getElementById('alertsList');

    let notificationsEnabled = false;
    let swRegistration = null;

    function addDebug(msg) {
      const p = document.createElement('div');
      p.textContent = '> ' + new Date().toLocaleTimeString() + ': ' + msg;
      debugLog.appendChild(p);
      debugLog.scrollTop = debugLog.scrollHeight;
      console.log(msg);
    }

    function getDeviceId() {
      let id = localStorage.getItem('device_id');
      if (!id) {
        id = 'device_' + Date.now();
        localStorage.setItem('device_id', id);
      }
      return id;
    }

    async function saveToken(token) {
      try {
        await db.collection('tokens').doc(getDeviceId()).set({
          token: token,
          lastActive: new Date().toISOString(),
          userAgent: navigator.userAgent
        });
        addDebug('✅ TOKEN SAVED to Firestore!');
        statusMsg.innerHTML = '✅ Ready to receive alerts';
        return true;
      } catch(e) {
        addDebug('❌ Save failed: ' + e.message);
        return false;
      }
    }

    // Show notification using Service Worker (fixes Illegal constructor error)
    async function showNotification(title, body) {
      if (!notificationsEnabled) return;
      
      // Use service worker if available (works on mobile)
      if (swRegistration && swRegistration.showNotification) {
        await swRegistration.showNotification(title, {
          body: body,
          icon: '/Icon-192.png',
          badge: '/Icon-192.png'
        });
        addDebug('Notification shown via Service Worker');
        return true;
      }
      
      // Fallback for when service worker isn't ready
      if (Notification.permission === 'granted') {
        try {
          const notification = new Notification(title, { body: body, icon: '/Icon-192.png' });
          addDebug('Notification shown via fallback');
          return true;
        } catch(e) {
          addDebug('Notification fallback error: ' + e.message);
          return false;
        }
      }
      return false;
    }

    async function enableNotifications() {
      addDebug('Step 1: Requesting permission...');
      const permission = await Notification.requestPermission();
      addDebug('Permission result: ' + permission);
      
      if (permission !== 'granted') {
        statusMsg.innerHTML = '❌ Permission denied';
        return;
      }
      
      addDebug('Step 2: Getting FCM token from Firebase...');
      try {
        const fcmToken = await messaging.getToken({ vapidKey: VAPID_KEY });
        if (fcmToken) {
          addDebug('✅ Token received: ' + fcmToken.substring(0, 30) + '...');
          await saveToken(fcmToken);
          notificationsEnabled = true;
          enableBtn.textContent = '✅ Notifications ON';
          enableBtn.classList.add('on');
          addDebug('✅ Ready! You will now receive notifications.');
          
          // Test notification
          await showNotification('SENwear Ready', 'Notifications are enabled on this device');
        } else {
          addDebug('❌ No token received. Check VAPID key and Firebase config.');
        }
      } catch(e) {
        addDebug('❌ Token error: ' + e.message);
      }
    }

    // Handle messages when app is open
    messaging.onMessage(async (payload) => {
      addDebug('📨 Push notification received while app open');
      if (payload.notification) {
        await showNotification(payload.notification.title, payload.notification.body);
      }
    });

    sendBtn.onclick = async () => {
      const role = document.getElementById('role').value;
      const initials = document.getElementById('initials').value;
      const student = document.getElementById('student').value;
      const type = document.getElementById('type').value;
      const message = document.getElementById('message').value;
      
      if (!initials || !message) {
        sendStatus.innerHTML = '⚠️ Please fill initials and message';
        setTimeout(() => sendStatus.innerHTML = '', 2000);
        return;
      }
      
      sendStatus.innerHTML = '📤 Sending alert...';
      
      try {
        const alertData = {
          role: role,
          initials: initials.toUpperCase(),
          student: student,
          type: type,
          message: message,
          timestamp: Date.now(),
          acknowledged: false
        };
        
        addDebug('Saving alert to Firestore: ' + message.substring(0, 30));
        await db.collection('alerts').add(alertData);
        
        sendStatus.innerHTML = '✅ Sent!';
        document.getElementById('message').value = '';
        setTimeout(() => sendStatus.innerHTML = '', 2000);
        addDebug('Alert saved successfully');
        
        // Show confirmation notification on sender's device
        await showNotification('Alert Sent', `${initials}: ${message.substring(0, 50)}`);
      } catch(e) {
        addDebug('❌ Send error: ' + e.message);
        sendStatus.innerHTML = '❌ Error: ' + e.message;
      }
    };

    window.acknowledge = async (id) => {
      try {
        await db.collection('alerts').doc(id).update({ acknowledged: true });
        addDebug('Alert acknowledged: ' + id);
      } catch(e) {
        addDebug('Acknowledge error: ' + e.message);
      }
    };

    // Real-time alerts listener
    db.collection('alerts')
      .orderBy('timestamp', 'desc')
      .onSnapshot(snapshot => {
        addDebug('Alerts updated, count: ' + snapshot.size);
        
        if (snapshot.empty) {
          alertsList.innerHTML = '<div class="alert">No alerts yet. Send one above!</div>';
          return;
        }
        
        let html = '';
        const ONE_DAY = 24 * 60 * 60 * 1000;
        
        snapshot.forEach(doc => {
          const a = doc.data();
          if (Date.now() - a.timestamp > ONE_DAY) return;
          html += `
            <div class="alert">
              <strong>${a.type || 'Alert'}</strong><br>
              ${a.student || ''} — ${a.message}<br>
              <em>${a.role} (${a.initials})</em>
              <div class="timestamp">${new Date(a.timestamp).toLocaleString()}</div>
              ${!a.acknowledged ? `<button onclick="acknowledge('${doc.id}')" style="background:#355e50; margin-top:8px; padding:6px;">✓ Acknowledge</button>` : ''}
            </div>
          `;
        });
        
        alertsList.innerHTML = html || '<div class="alert">No alerts in last 24 hours</div>';
      }, error => {
        addDebug('Firestore error: ' + error.message);
      });

    // Service Worker registration - store reference
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then(reg => {
          swRegistration = reg;
          addDebug('Service Worker registered');
        })
        .catch(err => addDebug('SW error: ' + err.message));
    }

    // Check existing permission
    if (Notification.permission === 'granted') {
      notificationsEnabled = true;
      enableBtn.textContent = '✅ Notifications ON';
      enableBtn.classList.add('on');
      statusMsg.innerHTML = 'Ready';
      messaging.getToken({ vapidKey: VAPID_KEY }).then(token => {
        if (token) saveToken(token);
        else addDebug('No existing token found');
      }).catch(e => addDebug('Token refresh error: ' + e.message));
    } else {
      enableBtn.onclick = enableNotifications;
    }
  </script>
</body>
</html>
