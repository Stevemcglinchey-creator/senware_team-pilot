<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SENware – Team Pilot</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont; background: #f3faf6; }
  .card { background: #ffffff; border-radius: 14px; box-shadow: 0 4px 10px rgba(0,0,0,.05); }
</style>
</head>
<body class="p-3">

<!-- LOGO / HEADER -->
<div class="card p-4 text-center mb-4">
  <img src="Icon-192.png" alt="SENware Logo" class="mx-auto mb-2 w-24 h-24"/>
  <h1 class="text-xl font-semibold text-emerald-700">SENware Team Pilot</h1>
  <p class="text-sm text-slate-600 mt-1">Internal testing – SNA & Substitute view</p>
</div>

<!-- ALERT FORM -->
<div class="card p-3 mb-4">
  <p class="text-sm font-semibold mb-2 text-emerald-700">Quick Alert</p>

  <select id="role" class="w-full border rounded-lg p-2 text-sm mb-2">
    <option value="">Select role</option>
    <option value="SNA">SNA</option>
    <option value="Part-Time SNA">Part-Time SNA</option>
    <option value="Sub">Sub</option>
    <option value="SENCO">SENCO</option>
    <option value="VP">VP</option>
    <option value="Principal">Principal</option>
  </select>

  <input id="initials" class="w-full border rounded-lg p-2 text-sm mb-2" placeholder="Student Initials (e.g. D.B)" />
  <input id="message" class="w-full border rounded-lg p-2 text-sm" placeholder="Type your message here" />

  <button id="sendAlert" class="mt-3 w-full bg-emerald-600 text-white rounded-lg p-3 font-semibold">
    Send Alert
  </button>

  <a href="https://docs.google.com/forms/d/e/1FAIpQLScL5SkWYIoPDhybgEU8flLw9TCZSI2nh0217NCoNiKym_UAOg/viewform?usp=header" target="_blank"
     class="block text-center bg-emerald-500 text-white rounded-lg p-3 font-semibold mt-3">
    Give Feedback (1 min)
  </a>
</div>

<div class="text-center text-xs text-slate-400 py-2">
  Demo only • No real student data is stored permanently. All pilot data auto-deletes at end.
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const btn = document.getElementById("sendAlert");

  if (!btn) {
    alert("Button not found – JS not bound");
    return;
  }

  btn.addEventListener("click", async () => {
    const role = document.getElementById('role').value;
    const initials = document.getElementById('initials').value.trim();
    const message = document.getElementById('message').value.trim();

    if (!role || !initials || !message) {
      alert("Fill all fields");
      return;
    }

    btn.innerText = "Sending...";
    btn.disabled = true;

    try {
      const response = await fetch(
        "https://script.google.com/macros/s/YOUR_EXEC_URL/exec",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            role,
            initials,
            message,
            source: "Team Pilot"
          })
        }
      );

      if (!response.ok) throw new Error("Network response failed");

      await response.json();
      alert("Alert sent ✔");

      document.getElementById('initials').value = "";
      document.getElementById('message').value = "";

    } catch (err) {
      console.error(err);
      alert("Connection error");
    } finally {
      btn.innerText = "Send Alert";
      btn.disabled = false;
    }
  });

});
</script>
