<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SENware – Team Pilot</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- PWA manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10b981">

<style>
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont; background: #f3faf6; }
  .card { background: #ffffff; border-radius: 14px; box-shadow: 0 4px 10px rgba(0,0,0,.05); }
</style>
</head>

<body class="p-3">

<!-- LOGO / HEADER -->
<div class="card p-4 text-center mb-4">
  <img src="Icon-192.png" alt="SENware Logo" class="mx-auto mb-2 w-24 h-24"/>
  <h1 class="text-xl font-semibold text-emerald-700">SENware Team Pilot</h1>
  <p class="text-sm text-slate-600 mt-1">Internal testing – SNA & Substitute view</p>
</div>

<!-- VIDEO WALKTHROUGH -->
<div class="card p-3 mb-4">
  <p class="text-sm font-semibold mb-2 text-emerald-700">▶️ Video Walkthrough</p>
  <video controls class="w-full rounded-lg">
    <source src="Team_Pilot.mp4" type="video/mp4">
    Your browser does not support video.
  </video>
  <p class="text-xs text-slate-500 mt-2">(Optional – video file in same folder)</p>
</div>

<!-- ALERT FORM -->
<div class="card p-3 mb-4">
  <p class="text-sm font-semibold mb-2 text-emerald-700">Quick Alert</p>

  <select id="role" class="w-full border rounded-lg p-2 text-sm mb-2">
    <option value="">Select role</option>
    <option value="SNA">SNA</option>
    <option value="Part-Time SNA">Part-Time SNA</option>
    <option value="Sub">Sub</option>
    <option value="SENCO">SENCO</option>
    <option value="VP">VP</option>
    <option value="Principal">Principal</option>
  </select>

  <input id="initials" class="w-full border rounded-lg p-2 text-sm mb-2" placeholder="Student Initials (e.g. D.B)" />
  <input id="message" class="w-full border rounded-lg p-2 text-sm" placeholder="Type your message here" />

  <button id="sendAlert" class="mt-3 w-full bg-emerald-600 text-white rounded-lg p-3 font-semibold">
    Send Alert
  </button>

  <div class="mt-4">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLScL5SkWYIoPDhybgEU8flLw9TCZSI2nh0217NCoNiKym_UAOg/viewform?usp=header"
       target="_blank"
       class="block text-center bg-emerald-500 text-white rounded-lg p-3 font-semibold">
      Give Feedback (1 min)
    </a>
  </div>
</div>

<div class="text-center text-xs text-slate-400 py-2">
  Demo only • All pilot data auto-deletes at end.
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => console.log("SW registered"));
}

// Send alert to Google Apps Script
document.getElementById('sendAlert').addEventListener('click', async () => {
  const role = document.getElementById('role').value;
  const initials = document.getElementById('initials').value.trim();
  const message = document.getElementById('message').value.trim();

  if (!role || !initials || !message) return alert("Fill all fields");

  try {
    const response = await fetch("https://script.google.com/macros/s/AKfycbw4nf7LexEqlajV4J6PvOhfu5w-gwbnSOwQ3GAfCveeuuCRn6GLcm82hx4ckG_VLOAM/exec", {
      method: "POST",
      body: JSON.stringify({ role, initials, message })
    });

    if (response.ok) {
      alert("Alert sent!");
      document.getElementById('initials').value = "";
      document.getElementById('message').value = "";
    } else {
      alert("Error sending alert");
    }
  } catch(err) {
    console.error(err);
    alert("Connection error");
  }
});
</script>
</body>
</html>
