<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SENware – Team Pilot</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#059669">

<style>
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont; background: #f3faf6; }
  .card { background: #ffffff; border-radius: 14px; box-shadow: 0 4px 10px rgba(0,0,0,.05); }
</style>
</head>

<body>
<div id="root" class="p-3"></div>

<script type="text/babel">
const { useState } = React;

// ---------------- CONFIG ----------------
const roles = ["SNA", "Substitute", "Part-Time SNA", "SENCO", "VP", "Principal"];
const students = []; // leave empty for initials input

function App() {
  const [role, setRole] = useState(roles[0]);
  const [studentInitials, setStudentInitials] = useState("");
  const [note, setNote] = useState("");
  const [alerts, setAlerts] = useState([]);

  function sendAlert() {
    if (!studentInitials.trim() || !note.trim()) return alert("Fill in initials and note");
    const newAlert = {
      role,
      initials: studentInitials.toUpperCase(),
      message: note,
      time: new Date().toLocaleTimeString()
    };
    setAlerts([newAlert, ...alerts]);
    setNote("");
    setStudentInitials("");

    // --- Send to Google Sheet ---
    fetch("YOUR_APPS_SCRIPT_WEBAPP_URL_HERE", {
      method: "POST",
      body: JSON.stringify(newAlert),
      mode: "no-cors"
    });
  }

  return (
    <div className="space-y-4 max-w-md mx-auto">

      {/* HEADER */}
      <div className="card p-4 text-center">
        <h1 className="text-xl font-semibold text-emerald-700">SENware Team Pilot</h1>
        <p className="text-sm text-slate-600 mt-1">Mobile Demo – SNA & Staff View</p>
      </div>

      {/* VIDEO WALKTHROUGH */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">▶️ 30-Second Walkthrough</p>
        <video controls className="w-full rounded-lg">
          <source src="Team_Pilot.mp4" type="video/mp4" />
          Your browser does not support video.
        </video>
      </div>

      {/* ROLE SELECTOR */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">Select Role</p>
        <div className="flex flex-wrap gap-2">
          {roles.map(r => (
            <button key={r} onClick={() => setRole(r)}
              className={`p-2 rounded-lg text-sm flex-1 ${
                role === r ? "bg-emerald-600 text-white" : "bg-emerald-50 text-emerald-800"
              }`}
            >{r}</button>
          ))}
        </div>
      </div>

      {/* STUDENT INITIALS & ALERT */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">Send Quick Alert</p>
        <input
          className="w-full border rounded-lg p-2 text-sm mb-2"
          placeholder="Student Initials e.g. D.B"
          value={studentInitials}
          onChange={e => setStudentInitials(e.target.value)}
        />
        <input
          className="w-full border rounded-lg p-2 text-sm"
          placeholder="Alert note e.g. Absent this morning"
          value={note}
          onChange={e => setNote(e.target.value)}
        />
        <button
          onClick={sendAlert}
          className="mt-2 w-full bg-emerald-600 text-white rounded-lg p-2"
        >Send Alert</button>
      </div>

      {/* ALERT LOG */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">SNA Handover Log</p>
        {alerts.length === 0 && <p className="text-sm text-slate-500">No alerts yet</p>}
        <ul className="space-y-2">
          {alerts.map((a,i)=>(
            <li key={i} className="border rounded-lg p-2 text-sm">
              <div className="text-slate-700">{a.initials}: {a.message}</div>
              <div className="text-xs text-slate-400 mt-1">{a.time} • Role: {a.role}</div>
            </li>
          ))}
        </ul>
      </div>

      {/* FEEDBACK */}
      <div className="card p-3">
        <p className="text-sm font-semibold mb-2 text-emerald-700">Quick Feedback</p>
        <p className="text-sm text-slate-600 mb-3">Help us improve SENware!</p>
        <a href="YOUR_GOOGLE_FORM_LINK_HERE" target="_blank"
           className="block text-center bg-emerald-600 text-white rounded-lg p-3 font-semibold">
          Give Feedback (1 min)
        </a>
      </div>

      {/* FOOTER */}
      <div className="text-center text-xs text-slate-400 py-2">Demo only • No real student data</div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
    .then(()=>console.log('Service Worker registered'));
}
</script>

</body>
</html>
