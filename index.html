<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SENwear Team Pilot</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f2f24; color: white; padding: 20px; }
    .container { max-width: 600px; margin: auto; }
    .card { background: #1b3d32; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #2f5e4c; }
    h1 { color: #7fe0b2; text-align: center; margin-bottom: 10px; }
    h2 { color: #7fe0b2; font-size: 1.3rem; margin-bottom: 15px; }
    input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: none; background: #0f2f24; color: white; }
    button { width: 100%; padding: 14px; margin-top: 12px; border-radius: 40px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
    .enable-btn { background: #1f7a5c; color: white; }
    .enable-btn.on { background: #2fa46f; }
    .send-btn { background: #2fa46f; color: white; }
    .alert { background: #274e41; border-radius: 12px; padding: 12px; margin-top: 10px; }
    .debug { background: #0a1a15; padding: 12px; border-radius: 12px; font-family: monospace; font-size: 11px; margin-top: 12px; max-height: 150px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>📡 SENwear Team Pilot</h1>
      <p style="text-align:center">Internal staff communication + push notifications</p>
      <button id="enableBtn" class="enable-btn">🔔 Enable Notifications</button>
      <div id="statusMsg" style="font-size: 12px; margin-top: 8px;"></div>
      <div id="debugLog" class="debug">App loaded. Click enable.</div>
    </div>

    <div class="card">
      <h2>⚡ Quick Alert</h2>
      <select id="role"><option>SNA</option><option>Teacher</option><option>SENCO</option><option>VP</option></select>
      <input id="initials" placeholder="Your initials" />
      <input id="student" placeholder="Student initials" />
      <select id="type"><option>Health</option><option>Behaviour</option><option>Attendance</option><option>Needs-to-Know</option></select>
      <textarea id="message" rows="3" placeholder="Type alert message"></textarea>
      <button id="sendBtn" class="send-btn">Send Alert</button>
      <div id="sendStatus" style="font-size: 12px; margin-top: 8px;"></div>
    </div>

    <div class="card">
      <h2>📡 Live Alerts</h2>
      <div id="alertsList">No alerts yet</div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"></script>
  <script>
    // ========== ONESIGNAL CONFIGURATION ==========
    // REPLACE WITH YOUR ONESIGNAL APP ID
    const ONESIGNAL_APP_ID = "c7e5ef68-f377-47ba-bd3b-2b1ea988f904";
    
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(function(OneSignal) {
      OneSignal.init({
        appId: ONESIGNAL_APP_ID,
        notifyButton: {
          enable: true,
        },
      });
    });
  </script>

  <script>
    // ========== FIREBASE CONFIG ==========
    const firebaseConfig = {
      apiKey: "AIzaSyDbruzYo2ln8XY9MqTqXVkSsKUodeEux1U",
      authDomain: "senwear-pilot-2.firebaseapp.com",
      projectId: "senwear-pilot-2",
      storageBucket: "senwear-pilot-2.firebasestorage.app",
      messagingSenderId: "926491466146",
      appId: "1:926491466146:web:1148a3e80ebeef3b15fafb"
    };
    const VAPID_KEY = "BHQbQTfknjVMsBv2LISk6W3p1SJgasmLXgj-p58KgigzvtjFORWZVmPCgpHo8ExuTbkgNjS7uJCDIc36v9R9MWA";

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const messaging = firebase.messaging();

    const enableBtn = document.getElementById('enableBtn');
    const statusMsg = document.getElementById('statusMsg');
    const debugLog = document.getElementById('debugLog');
    const sendBtn = document.getElementById('sendBtn');
    const sendStatus = document.getElementById('sendStatus');
    const alertsList = document.getElementById('alertsList');

    let notificationsEnabled = false;
    let swRegistration = null;

    function addDebug(msg) {
      const p = document.createElement('div');
      p.textContent = '> ' + new Date().toLocaleTimeString() + ': ' + msg;
      debugLog.appendChild(p);
      debugLog.scrollTop = debugLog.scrollHeight;
      console.log(msg);
    }

    function getDeviceId() {
      let id = localStorage.getItem('device_id');
      if (!id) {
        id = 'device_' + Date.now();
        localStorage.setItem('device_id', id);
      }
      return id;
    }

    async function saveToken(token) {
      try {
        await db.collection('tokens').doc(getDeviceId()).set({
          token: token,
          lastActive: new Date().toISOString()
        });
        addDebug('✅ Token saved to Firestore');
        return true;
      } catch(e) {
        addDebug('❌ Save failed: ' + e.message);
        return false;
      }
    }

    // Send push via OneSignal to ALL subscribed devices
    async function sendOneSignalNotification(title, message) {
      addDebug(`📤 Sending OneSignal notification: ${title}`);
      
      // OneSignal automatically sends to all subscribed users
      // The SDK handles this - we just need to ensure OneSignal is initialized
      if (window.OneSignal) {
        try {
          await window.OneSignal.sendSelfNotification(title, message, {}, {});
          addDebug('✅ OneSignal notification sent');
        } catch(e) {
          addDebug('⚠️ OneSignal send error: ' + e.message);
        }
      } else {
        addDebug('⚠️ OneSignal not ready');
      }
    }

    async function showNotification(title, body) {
      if (!notificationsEnabled) return;
      
      if (swRegistration && swRegistration.showNotification) {
        await swRegistration.showNotification(title, { body: body, icon: '/Icon-192.png' });
        addDebug(`🔔 Notification: ${title}`);
      } else if (Notification.permission === 'granted') {
        new Notification(title, { body: body, icon: '/Icon-192.png' });
        addDebug(`🔔 Notification: ${title}`);
      }
    }

    async function enableNotifications() {
      addDebug('Requesting permission...');
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        statusMsg.innerHTML = '❌ Permission denied';
        return;
      }
      
      addDebug('Getting FCM token...');
      try {
        const token = await messaging.getToken({ vapidKey: VAPID_KEY });
        if (token) {
          addDebug('✅ Token received');
          await saveToken(token);
          notificationsEnabled = true;
          enableBtn.textContent = '✅ Notifications ON';
          enableBtn.classList.add('on');
          await showNotification('SENwear Ready', 'You will receive alerts');
        } else {
          addDebug('❌ No token');
        }
      } catch(e) {
        addDebug('❌ Token error: ' + e.message);
      }
    }

    messaging.onMessage(async (payload) => {
      addDebug('📨 Alert received');
      if (payload.notification) {
        await showNotification(payload.notification.title, payload.notification.body);
      }
    });

    sendBtn.onclick = async () => {
      const role = document.getElementById('role').value;
      const initials = document.getElementById('initials').value;
      const student = document.getElementById('student').value;
      const type = document.getElementById('type').value;
      const message = document.getElementById('message').value;
      
      if (!initials || !message) {
        sendStatus.innerHTML = '⚠️ Fill initials and message';
        setTimeout(() => sendStatus.innerHTML = '', 2000);
        return;
      }
      
      sendStatus.innerHTML = '📤 Sending...';
      try {
        await db.collection('alerts').add({
          role, initials: initials.toUpperCase(), student, type, message,
          timestamp: Date.now(), acknowledged: false
        });
        sendStatus.innerHTML = '✅ Sent!';
        document.getElementById('message').value = '';
        setTimeout(() => sendStatus.innerHTML = '', 2000);
        addDebug('Alert saved');
        
        // Send OneSignal notification to all devices
        await sendOneSignalNotification(`📢 ${type} from ${initials}`, message);
        await showNotification('Alert Sent', `${initials}: ${message.substring(0, 50)}`);
      } catch(e) {
        sendStatus.innerHTML = '❌ Error: ' + e.message;
      }
    };

    window.acknowledge = async (id) => {
      await db.collection('alerts').doc(id).update({ acknowledged: true });
    };

    db.collection('alerts').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
      if (snapshot.empty) { alertsList.innerHTML = '<div class="alert">No alerts</div>'; return; }
      let html = '';
      snapshot.forEach(doc => {
        const a = doc.data();
        if (Date.now() - a.timestamp > 86400000) return;
        html += `<div class="alert"><strong>${a.type}</strong><br>${a.student} — ${a.message}<br><em>${a.role} (${a.initials})</em><div class="timestamp">${new Date(a.timestamp).toLocaleTimeString()}</div>${!a.acknowledged ? `<button onclick="acknowledge('${doc.id}')" style="background:#355e50; margin-top:8px; padding:6px;">✓ Acknowledge</button>` : ''}</div>`;
      });
      alertsList.innerHTML = html;
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then(reg => { swRegistration = reg; addDebug('Service Worker ready'); })
        .catch(err => addDebug('SW error: ' + err.message));
    }

    if (Notification.permission === 'granted') {
      notificationsEnabled = true;
      enableBtn.textContent = '✅ Notifications ON';
      enableBtn.classList.add('on');
      messaging.getToken({ vapidKey: VAPID_KEY }).then(t => t && saveToken(t));
    } else {
      enableBtn.onclick = enableNotifications;
    }
  </script>
</body>
</html>
