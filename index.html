<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a5f4c">
  <title>SENwear | Staff Alerts</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f5f7fb;
      color: #1e293b;
      line-height: 1.5;
    }
    .passcode-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1a5f4c;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .passcode-card {
      background: white;
      border-radius: 32px;
      padding: 40px 32px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2);
    }
    .passcode-card h2 { color: #1a5f4c; margin-bottom: 8px; }
    .passcode-card p { color: #64748b; font-size: 0.85rem; margin-bottom: 24px; }
    .passcode-input {
      width: 100%;
      padding: 14px;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 60px;
      margin-bottom: 16px;
      font-family: monospace;
    }
    .unlock-btn {
      width: 100%;
      padding: 14px;
      background: #1a5f4c;
      color: white;
      border: none;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
    }
    .error-msg { color: #dc2626; font-size: 0.8rem; margin-top: 12px; }
    .main-app {
      display: none;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #eef2f6;
    }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { color: #1a5f4c; font-size: 1.8rem; }
    .badge {
      background: #e6f7f3;
      color: #1a5f4c;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      display: inline-block;
      margin-top: 8px;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-weight: 500;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #475569;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #1a5f4c;
    }
    .send-btn {
      width: 100%;
      padding: 14px;
      background: #1a5f4c;
      color: white;
      border: none;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .reset-btn {
      background: #e2e8f0;
      color: #1e293b;
      margin-top: 12px;
    }
    .ack-btn {
      background: #e2e8f0;
      color: #1e293b;
      border: none;
      border-radius: 40px;
      padding: 6px 12px;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    .alerts-list { max-height: 400px; overflow-y: auto; }
    .alert-item {
      background: #f8fafc;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid #1a5f4c;
    }
    .alert-item.acknowledged {
      opacity: 0.7;
      border-left-color: #94a3b8;
    }
    .alert-time { font-size: 0.7rem; color: #94a3b8; margin-bottom: 6px; }
    .alert-student { font-weight: 700; color: #1a5f4c; }
    .alert-message { font-size: 0.9rem; margin: 6px 0; }
    .alert-sender { font-size: 0.7rem; color: #64748b; }
    .footer {
      text-align: center;
      font-size: 0.7rem;
      color: #94a3b8;
      padding: 20px;
    }
    .loading { text-align: center; padding: 40px; color: #94a3b8; }
    .inline-hint { font-size: 0.7rem; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>

<!-- Passcode Screen -->
<div id="passcodeOverlay" class="passcode-overlay">
  <div class="passcode-card">
    <h2>🔐 SENwear</h2>
    <p>Enter team passcode to access the pilot</p>
    <input type="password" id="passcodeInput" class="passcode-input" placeholder="••••••" maxlength="6">
    <button id="unlockBtn" class="unlock-btn">Unlock</button>
    <div id="passcodeError" class="error-msg"></div>
  </div>
</div>

<!-- Main App -->
<div id="mainApp" class="main-app">
  <div class="header">
    <h1>📡 SENwear</h1>
    <div class="badge">Pilot Programme • Donegal</div>
  </div>

  <!-- Profile Card (one‑time setup) -->
  <div class="card" id="profileCard">
    <h2 style="font-size: 1.2rem; margin-bottom: 16px;">👤 Your profile</h2>
    <div class="form-group">
      <label>Your role</label>
      <select id="roleSelect">
        <option value="">Select your role</option>
        <option value="SNA">SNA (receive SMS)</option>
        <option value="VP">VP (send only, no SMS)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Your name (as it will appear in alerts)</label>
      <select id="nameSelect">
        <option value="">Select your name</option>
        <option value="Steve">Steve</option>
        <option value="Shaun">Shaun</option>
        <option value="Kelly">Kelly</option>
        <option value="Margaret">Margaret</option>
        <option value="Audrey">Audrey</option>
        <option value="Mary">Mary</option>
        <option value="Karina">Karina</option>
        <option value="Tara">Tara</option>
        <option value="Michelle">Michelle</option>
        <option value="Maria">Maria</option>
        <option value="Megan">Megan</option>
      </select>
    </div>
    <div class="form-group">
      <label>Your mobile phone number (for receiving SMS)</label>
      <input type="tel" id="userPhone" placeholder="+353861234567" value="">
      <div class="inline-hint">Only used to exclude your own alerts. Format: +353 86 123 4567</div>
    </div>
    <button id="saveProfileBtn" class="send-btn" style="background: #64748b;">Save profile</button>
    <button id="resetAppBtn" class="send-btn reset-btn" style="background: #e2e8f0; color:#1e293b;">Reset app (clear my data)</button>
    <div id="profileStatus" style="font-size: 0.75rem; margin-top: 12px;"></div>
  </div>

  <!-- Send Alert Card (visible after profile saved) -->
  <div class="card" id="alertCard" style="display: none;">
    <h2 style="font-size: 1.2rem; margin-bottom: 16px;">⚡ Quick Alert</h2>
    <div class="form-group">
      <label>Student initials</label>
      <input type="text" id="student" placeholder="e.g., JD">
    </div>
    <div class="form-group">
      <label>Alert type</label>
      <select id="type">
        <option value="Health">Health</option>
        <option value="Behaviour">Behaviour</option>
        <option value="Attendance">Attendance</option>
        <option value="Academic">Academic</option>
      </select>
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea id="message" rows="3" placeholder="What's happening?"></textarea>
    </div>
    <button id="sendAlertBtn" class="send-btn">📢 Send Alert</button>
    <div id="sendStatus" style="font-size: 0.75rem; margin-top: 12px; text-align: center;"></div>
  </div>

  <!-- Live Alerts Card -->
  <div class="card">
    <h2 style="font-size: 1.2rem; margin-bottom: 16px;">📡 Live Alerts</h2>
    <div id="alertsList" class="alerts-list">
      <div class="loading">Loading alerts...</div>
    </div>
  </div>

  <div class="footer">
    SENwear Pilot • Built by an SNA for Irish schools
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  // ========== PASSCODE ==========
  const PILOT_PASSCODE = "SNA202";
  // For debugging: always show passcode screen on load (ignore previous unlock)
  // To keep previous behavior, set ALWAYS_SHOW_PASSCODE to false.
  const ALWAYS_SHOW_PASSCODE = true;  // set to false to remember unlock

  const passcodeOverlay = document.getElementById('passcodeOverlay');
  const mainApp = document.getElementById('mainApp');
  const passcodeInput = document.getElementById('passcodeInput');
  const unlockBtn = document.getElementById('unlockBtn');
  const passcodeError = document.getElementById('passcodeError');

  let isUnlocked = false;

  function unlockApp() {
    passcodeOverlay.style.display = 'none';
    mainApp.style.display = 'block';
    if (!ALWAYS_SHOW_PASSCODE) {
      localStorage.setItem('senwear_unlocked', 'true');
    }
    // Initialize Firebase and profile after unlocking
    initFirebaseAndProfile();
  }

  unlockBtn.onclick = () => {
    if (passcodeInput.value === PILOT_PASSCODE) {
      unlockApp();
    } else {
      passcodeError.textContent = '❌ Invalid passcode';
      passcodeInput.value = '';
    }
  };
  passcodeInput.onkeypress = (e) => { if (e.key === 'Enter') unlockBtn.click(); };

  // Check stored unlock only if we want to remember
  if (!ALWAYS_SHOW_PASSCODE && localStorage.getItem('senwear_unlocked') === 'true') {
    isUnlocked = true;
    unlockApp();
  }
  // Otherwise, passcode screen remains visible.

  // ========== PROFILE & FIREBASE ==========
  let db = null;

  function initFirebaseAndProfile() {
    const firebaseConfig = {
      apiKey: "AIzaSyDbruzYo2ln8XY9MqTqXVkSsKUodeEux1U",
      authDomain: "senwear-pilot-2.firebaseapp.com",
      projectId: "senwear-pilot-2",
      storageBucket: "senwear-pilot-2.firebasestorage.app",
      messagingSenderId: "926491466146",
      appId: "1:926491466146:web:1148a3e80ebeef3b15fafb"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    db = firebase.firestore();

    // Load saved profile from localStorage
    const savedRole = localStorage.getItem('senwear_role');
    const savedName = localStorage.getItem('senwear_name');
    const savedPhone = localStorage.getItem('senwear_phone');
    if (savedRole) document.getElementById('roleSelect').value = savedRole;
    if (savedName) document.getElementById('nameSelect').value = savedName;
    if (savedPhone) document.getElementById('userPhone').value = savedPhone;

    // If profile already exists, show alert card
    if (savedRole && savedName && savedPhone) {
      document.getElementById('profileCard').style.display = 'none';
      document.getElementById('alertCard').style.display = 'block';
      startLiveFeed();
    }

    // Save profile button
    const saveBtn = document.getElementById('saveProfileBtn');
    const profileStatus = document.getElementById('profileStatus');
    saveBtn.onclick = () => {
      const role = document.getElementById('roleSelect').value;
      const name = document.getElementById('nameSelect').value;
      const phone = document.getElementById('userPhone').value.trim();
      if (!role || !name || !phone) {
        profileStatus.textContent = '⚠️ Please fill all fields';
        return;
      }
      if (!phone.match(/^\+[0-9]{10,15}$/)) {
        profileStatus.textContent = '⚠️ Phone must be in international format, e.g., +353861234567';
        return;
      }
      localStorage.setItem('senwear_role', role);
      localStorage.setItem('senwear_name', name);
      localStorage.setItem('senwear_phone', phone);
      document.getElementById('profileCard').style.display = 'none';
      document.getElementById('alertCard').style.display = 'block';
      profileStatus.textContent = '';
      startLiveFeed();
    };

    // Reset button: clear all local storage and reload page
    const resetBtn = document.getElementById('resetAppBtn');
    resetBtn.onclick = () => {
      localStorage.clear();
      alert('App data cleared. Page will reload.');
      window.location.reload();
    };
  }

  function startLiveFeed() {
    if (!db) {
      console.error('Firestore not initialized');
      return;
    }
    const sendBtn = document.getElementById('sendAlertBtn');
    const sendStatus = document.getElementById('sendStatus');
    const alertsList = document.getElementById('alertsList');

    sendBtn.onclick = async () => {
      const student = document.getElementById('student').value.trim();
      const type = document.getElementById('type').value;
      const message = document.getElementById('message').value.trim();
      const name = localStorage.getItem('senwear_name');
      const role = localStorage.getItem('senwear_role');
      const senderPhone = localStorage.getItem('senwear_phone');

      if (!student || !message) {
        sendStatus.innerHTML = '⚠️ Please fill student and message';
        sendStatus.style.color = '#dc2626';
        setTimeout(() => sendStatus.innerHTML = '', 2000);
        return;
      }

      sendStatus.innerHTML = '📤 Sending...';
      sendStatus.style.color = '#1a5f4c';

      try {
        await db.collection('alerts').add({
          student: student.toUpperCase(),
          type: type,
          message: message,
          initials: name,
          role: role,
          senderPhone: senderPhone,
          timestamp: Date.now(),
          acknowledged: false
        });
        sendStatus.innerHTML = '✅ Alert sent!';
        document.getElementById('message').value = '';
        setTimeout(() => sendStatus.innerHTML = '', 2000);
      } catch (e) {
        sendStatus.innerHTML = '❌ Error: ' + e.message;
        sendStatus.style.color = '#dc2626';
      }
    };

    window.acknowledgeAlert = async (id) => {
      try {
        await db.collection('alerts').doc(id).update({ acknowledged: true });
      } catch (e) {
        console.error('Acknowledge error:', e);
      }
    };

    db.collection('alerts')
      .orderBy('timestamp', 'desc')
      .onSnapshot(snapshot => {
        if (snapshot.empty) {
          alertsList.innerHTML = '<div class="loading">No alerts yet</div>';
          return;
        }
        let html = '';
        snapshot.forEach(doc => {
          const a = doc.data();
          if (Date.now() - a.timestamp > 86400000) return;
          const date = new Date(a.timestamp).toLocaleTimeString();
          const ackClass = a.acknowledged ? 'acknowledged' : '';
          html += `
            <div class="alert-item ${ackClass}" data-id="${doc.id}">
              <div class="alert-time">${date}</div>
              <span class="alert-student">${a.student || '?'}</span>
              <span style="font-size:0.7rem; background:#eef2ff; padding:2px 8px; border-radius:20px; margin-left:8px;">${a.type}</span>
              <div class="alert-message">${a.message}</div>
              <div class="alert-sender">— ${a.initials} (${a.role || 'SNA'})</div>
              ${!a.acknowledged ? `<button class="ack-btn" onclick="acknowledgeAlert('${doc.id}')">✓ Acknowledge</button>` : ''}
            </div>
          `;
        });
        alertsList.innerHTML = html;
      });
  }
</script>
</body>
</html>
